x;letter-spacing:-.5px;margin:32px 0 12px}h3{line-height:1.35}.lead{font-size:19px;color:var(--muted);max-width:680px}.eyebrow{color:var(--green);font-size:12px;font-weight:750;letter-spacing:1.8px;text-transform:uppercase}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.primary{background:var(--green);color:white;border-color:var(--green)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin:28px 0}.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:22px}.card h3{margin:10px 0}.card p{color:var(--muted);font-size:14px}.card button{margin-top:8px}.num{font-size:13px;color:var(--green);font-weight:700}.callout{background:var(--soft);padding:22px 25px;border-left:4px solid var(--green);border-radius:0 8px 8px 0;margin:24px 0}.callout p{margin:8px 0}.warning{background:#fff2dd;border-color:#b97418;color:#543908}.lab{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:24px;margin:28px 0}.lab-title{display:flex;align-items:center;gap:12px;margin-bottom:8px}.lab-title span{background:var(--code);color:var(--accent);padding:3px 8px;border-radius:4px;font-size:12px;font-weight:700}.lab h3{margin:0}.lab input[type=number]{width:90px}.lab input,.lab select{border:1px solid var(--line);border-radius:5px;padding:8px;max-width:100%}.lab label{display:inline-flex;gap:8px;align-items:center;margin:5px}.result{background:var(--bg);border-radius:7px;padding:16px;margin-top:16px;overflow-wrap:anywhere}.formula,pre{font:15px/1.7 ui-monospace,monospace;background:var(--code);color:#ebf4f8;border-radius:8px;padding:20px;overflow:auto;white-space:pre-wrap}.options{display:grid;gap:8px}.options button{text-align:left}.correct{background:var(--soft)!important;border-color:var(--green)!important}.incorrect{background:#fff1eb!important;border-color:#b95427!important}.feedback{font-weight:600;margin-top:12px}.muted{color:var(--muted);font-size:14px}details{padding:14px 0;border-bottom:1px solid var(--line)}summary{cursor:pointer;font-weight:650}.notes{width:100%;min-height:125px;padding:14px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink)}.bottom{border-top:1px solid var(--line);padding-top:24px;margin-top:32px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:11px;text-align:left;border-bottom:1px solid var(--line)}th{background:var(--soft)}.pill{display:inline-block;background:var(--soft);color:var(--green);padding:5px 10px;border-radius:30px;font-size:12px;font-weight:650}.nodes{display:flex;gap:8px;align-items:end;flex-wrap:wrap;margin:16px 0}.node{min-width:45px;padding:12px 8px;border:1px solid var(--line);border-radius:5px;text-align:center}.node.current{background:var(--green);color:white}.bar{background:var(--soft);border:0;border-bottom:3px solid var(--green);display:flex;align-items:end;justify-content:center;min-height:36px}.node small{display:block}.flash{min-height:180px;text-align:center;display:grid;place-content:center;font-size:22px;padding:24px;background:var(--soft);border-radius:12px;margin:20px 0}.checkline{display:flex;gap:12px;align-items:flex-start;padding:10px 0}.checkline input{margin-top:9px}.studytext p{margin:18px 0}.source{font-size:13px;margin-top:18px;color:var(--muted)}.hero{position:relative;padding-bottom:8px}.hero:after{content:'↗';position:absolute;right:0;top:0;font-size:100px;color:#d7e8df;z-index:-1}.hide{display:none!important}body.dark{--bg:#10212a;--paper:#172d38;--ink:#e7f0f4;--muted:#b0c3cc;--line:#36505d;--green:#71dcad;--soft:#203f3a;--code:#09171d}body.dark .primary{color:#10251c}body.dark .warning{background:#3e311c;color:#ffe0ad}body.dark .incorrect{background:#533223!important}.mobile-toggle{display:none}#saveStatus{font-size:12px}#printArea{display:none}footer{margin-top:38px;color:var(--muted);font-size:12px}

<script>
const lessons=[{"unit": 1, "title": "Introduction to AI", "deck": "Introduction to AI.pdf", "body": "<p>Artificial intelligence studies systems that perceive, reason, learn, and act toward objectives. Four classic viewpoints ask whether a machine <b>thinks like humans, acts like humans, thinks rationally, or acts rationally</b>. The rational-agent view evaluates actions against a performance measure.</p><p>Core techniques include state-space search, logical inference, knowledge representation, planning, and learning from experience. Search explores alternatives; representation describes the world; inference derives consequences. AI matters when explicit hand-written instructions cannot conveniently cover every case.</p><p>The Turing test assesses conversational behaviour through an interrogator. A system would need language processing, knowledge, reasoning, and learning; the total Turing test additionally involves perception and physical interaction. Passing a behavioural test would not by itself establish consciousness.</p><p>Typical tasks include route planning, diagnosis, game playing, perception, and scheduling. Deep Blue defeated world chess champion Garry Kasparov in a match in 1997, using specialised search and evaluation. Narrow success in chess does not imply general human intelligence.</p>", "example": "A route planner represents roads as a graph, searches candidate routes, and chooses a route using an objective such as travel time. Changing the objective to toll cost may change the rational choice.", "trap": "An intelligent system need not imitate human thought. Rationality is assessed using available evidence, not perfect knowledge of the future.", "q": "Which statement best matches the rational-agent approach?", "options": ["Always imitate a human", "Choose an action expected to maximise the performance measure", "Always choose the fastest action"], "answer": 1, "why": "Rationality depends on the objective and available evidence, not human imitation.", "lab": ""}, {"unit": 1, "title": "Agents, rationality & PEAS", "deck": "Agent and Environment.pdf", "body": "<p>An <b>agent</b> receives percepts through sensors and acts through actuators. Its agent function maps an entire percept sequence to an action. The agent program implements that function on an architecture: <b>agent = architecture + program</b>.</p><p>A rational agent selects the action with the highest expected performance given its percept history, prior knowledge, and available actions. It can reasonably take an action that later fails. Omniscience would require knowing the actual outcome beforehand.</p><p><b>PEAS</b> specifies Performance measure, Environment, Actuators, and Sensors. Describe the task before selecting the agent design. Bounded rationality recognises limits on computation, time, and information. An autonomous agent relies increasingly on its own experience instead of only its designer’s built-in knowledge.</p>", "example": "Taxi PEAS: performance = safety, legality, travel time, passenger comfort; environment = roads, traffic, pedestrians; actuators = steering, brakes, accelerator, signals; sensors = cameras, GPS, speedometer. A camera is a sensor, not the environment.", "trap": "Performance measure describes external success; a utility function is an internal representation used to choose between outcomes.", "q": "For an online shopping agent, which is an actuator?", "options": ["Customer budget", "Product database", "The command that adds an item to the cart"], "answer": 2, "why": "An actuator changes the environment; a budget is a constraint and the database supplies information.", "lab": "peas"}, {"unit": 1, "title": "Environment types & classifications", "deck": "Agent and Environment.pdf", "body": "<p><b>Fully / partially observable:</b> do percepts reveal all information relevant to choosing an action? <b>Deterministic / stochastic:</b> does the present state and action determine the next state? Other agents can create strategic uncertainty.</p><p><b>Episodic / sequential:</b> does this decision affect later decisions? <b>Static / dynamic:</b> can the world change while the agent deliberates? In a semidynamic environment the world itself stays fixed but the performance score changes with time.</p><p><b>Discrete / continuous:</b> consider states, time, percepts, and actions. A task may mix both. <b>Single / multi-agent:</b> do other decision makers affect performance? <b>Known / unknown:</b> does the agent know the transition and observation rules? This is different from observability.</p><p>State your modelling assumptions. A static image classifier is usually episodic; a robot following a video stream may be sequential and dynamic.</p>", "example": "Chess with a clock is fully observable, deterministic in its game rules, sequential, semidynamic, discrete in board states and moves, and multi-agent. The clock is continuous; explain which dimension you classify. Poker is partially observable because opponents’ cards are hidden.", "trap": "“Unknown” does not mean “partially observable”: a new game can expose the complete board while its rules are unknown.", "q": "Why is taxi driving sequential?", "options": ["The road has lanes", "A turn changes the situations encountered later", "The taxi has multiple sensors"], "answer": 1, "why": "Actions influence future states, so decisions cannot be treated as independent episodes.", "lab": "env"}, {"unit": 1, "title": "Agent architectures", "deck": "Agent Classifications.pdf", "body": "<p>A <b>simple reflex agent</b> applies condition–action rules to the current percept. It can struggle when different hidden states produce the same observation. A <b>model-based reflex agent</b> updates internal state using past percepts and a model of how the world changes.</p><p>A <b>goal-based agent</b> evaluates whether actions lead to desired states and may search or plan. A <b>utility-based agent</b> compares how desirable outcomes are, supporting tradeoffs and uncertainty. These distinctions describe how decisions are made.</p><p>A <b>learning agent</b> improves with experience: the performance element selects actions; the critic evaluates behaviour; the learning element changes the system; the problem generator encourages informative exploration. Learning can improve reflex, goal-based, or utility-based agents rather than being a mutually exclusive architecture.</p>", "example": "Vacuum agent: “if dirty, suck” is reflex. Remembering which unseen rooms remain dirty adds a model. Planning to clean every room adds a goal. Trading cleaning quality against battery use adds utility.", "trap": "Memory alone does not make an agent goal-based; it must evaluate actions against an explicit goal.", "q": "Which learning-agent component encourages exploratory actions?", "options": ["Critic", "Problem generator", "Actuator"], "answer": 1, "why": "The problem generator proposes informative experience; the critic supplies feedback.", "lab": ""}, {"unit": 2, "title": "Formulating search problems", "deck": "State Space Search.pdf", "body": "<p>Specify <b>initial state, actions, transition model, goal test, and path cost</b>. A solution is an action sequence from the initial state to a goal; an optimal solution has minimum path cost.</p><p>The state space contains world configurations. A search tree contains paths considered by an algorithm, so the same state can occur in many nodes. A node usually stores its state, parent, action, depth, and cost g(n). Expanding a node generates successors.</p><p>The <b>frontier</b> stores discovered but unexpanded nodes. Graph search also tracks reached states to avoid cycling or redundant paths; cost-based search must update a reached state when a cheaper path appears. Compare algorithms by completeness, optimality, time, and memory.</p><p>Use b for branching factor, d for shallowest goal depth, and m for maximum depth. Complexity claims depend on whether you analyse tree search or a finite explicit graph.</p>", "example": "In the 8-puzzle, a state is the tile arrangement, actions slide a neighbouring tile into the blank, the goal test compares arrangements, and each move costs 1. Two different move sequences may reach the same arrangement.", "trap": "A state is not a node: two nodes can represent one state but have different path costs.", "q": "What distinguishes a search-tree node from just a state?", "options": ["Its path information, such as parent and cost", "It must be a goal", "It has no successors"], "answer": 0, "why": "Nodes represent paths through the state space, not only configurations.", "lab": ""}, {"unit": 2, "title": "Uninformed search: BFS, DFS & IDS", "deck": "Uninformed Search.pdf", "body": "<p><b>Breadth-first search (BFS)</b> uses a FIFO queue and explores increasing depth. It is complete with finite branching and a finite-depth solution, and gives a least-cost solution when all step costs are equal. Its large frontier is the main memory cost.</p><p><b>Depth-first search (DFS)</b> uses a stack or recursion. It follows one branch deeply before backtracking. Tree DFS can get lost on infinite paths or cycles and is not optimal. DFS with a visited set is complete on a finite graph, but is still not generally optimal.</p><p><b>Depth-limited search</b> refuses to expand beyond limit ℓ. Distinguish cutoff from failure: a cutoff suggests increasing the limit may help. <b>Iterative deepening (IDS)</b> repeats depth-limited search at 0, 1, 2, …, combining shallow-goal discovery with low memory. It is complete under finite branching and optimal for equal step costs.</p><p>In common tree-search analysis BFS takes O(b<sup>d+1</sup>) time/space if successors of depth-d nodes are generated before termination; a generation-time goal test can give O(b<sup>d</sup>). DFS takes O(b<sup>m</sup>) time and O(bm) space; IDS takes O(b<sup>d</sup>) time and O(bd) space. On an explicit finite graph, BFS/DFS traversal instead takes O(V+E) with visited-state bookkeeping.</p>", "example": "For S → [A,B], A → [C,D], B → [G], left-to-right BFS expands S,A,B,C,D,G; DFS expands S,A,C,D,B,G. Both reach G here, but only BFS guarantees a shallowest goal under the stated assumptions.", "trap": "BFS minimises edge count, not arbitrary weighted cost. Always state equal step costs when claiming optimality.", "q": "Which method repeatedly increases a depth limit?", "options": ["Uniform-cost search", "Iterative deepening", "Greedy best-first"], "answer": 1, "why": "IDS repeats depth-limited DFS while increasing the maximum depth.", "lab": "search"}, {"unit": 2, "title": "Uniform-cost search", "deck": "ucs.html", "body": "<p>Uniform-cost search (UCS) expands the frontier node with the smallest accumulated path cost <b>g(n)</b>. Use a minimum-priority queue. When a cheaper path to a state is discovered, replace its frontier cost or insert a new entry and ignore stale entries later.</p><p>Test for a goal when the node is <b>removed as the cheapest valid frontier entry</b>, not when it is generated. With nonnegative edges, an expanded node has minimum path cost in standard Dijkstra-style graph search.</p><p>For completeness in potentially infinite state spaces, the standard sufficient conditions include finite branching and step costs bounded below by ε &gt; 0. A finite graph can also handle zero-cost edges with proper duplicate detection. Negative edges invalidate the usual guarantee.</p><p>A common tree-search bound is O(b<sup>1+⌊C*/ε⌋</sup>) time and space, where C* is optimal solution cost. For a finite graph with a binary heap, Dijkstra-style implementation is O((V+E) log V).</p>", "example": "S→A costs 1; A→G costs 9; S→B costs 4; B→G costs 1. After A expands, G is generated at cost 10. UCS still expands B, improves G to 5, then returns S→B→G.", "trap": "Returning a goal as soon as it is generated can produce a more expensive route.", "q": "A goal at cost 12 is in the frontier, alongside a non-goal at cost 7. What does UCS pop?", "options": ["The goal", "The cost-7 node", "Whichever was generated first"], "answer": 1, "why": "UCS orders all frontier nodes by g, including goals.", "lab": "search"}, {"unit": 2, "title": "Heuristics, greedy search & A*", "deck": "Informed Search.pdf", "body": "<p>A heuristic h(n) estimates remaining cost. Greedy best-first orders nodes by h alone; A* orders them by <b>f(n)=g(n)+h(n)</b>. Greedy may ignore an expensive path already taken.</p><p>For A*, use a priority queue, update cheaper paths, and test the goal on removal. A zero heuristic makes A* behave like UCS. Heuristic quality can dramatically affect work, but worst-case time and memory can remain exponential.</p><p>In the tile puzzle, count misplaced numbered tiles or sum their Manhattan distances, excluding the blank. Under unit single-tile moves both lower-bound the remaining moves. Manhattan distance is at least the misplaced-tile count, so it is generally more informative.</p>", "example": "Frontier X has g=6,h=1; Y has g=2,h=4. Greedy chooses X because 1<4. A* chooses Y because f(Y)=6<f(X)=7. Neither priority is just depth.", "trap": "h(n)=0 does not imply n is a goal. A heuristic can give zero everywhere; the goal test is separate.", "q": "Which priority makes A* reduce to UCS?", "options": ["h(n)=0 for every node", "g(n)=0 for every node", "h(n)=100"], "answer": 0, "why": "Then f=g+h=g, exactly the UCS priority.", "lab": "search"}, {"unit": 2, "title": "Admissibility & monotone restriction", "deck": "Informed Search.pdf", "body": "<p><b>Admissible:</b> 0 ≤ h(n) ≤ h*(n), the true minimum remaining cost. <b>Consistent</b> (monotone restriction): h(n) ≤ c(n,n′)+h(n′) for every edge, with h(goal)=0.</p><p>Consistency makes f nondecreasing along a path and implies admissibility for nodes that can reach a goal. Admissibility alone does not imply consistency. A* tree search is optimal with an admissible heuristic under the usual termination assumptions. Graph A* can safely close nodes permanently with consistency; with an admissible but inconsistent heuristic, allow reopening on a better g.</p><p>If two admissible heuristics satisfy h₂ ≥ h₁ everywhere, h₂ dominates h₁. The maximum of admissible heuristics is admissible. Do not add them without proving the estimates count disjoint costs.</p>", "example": "Edge U→V costs 2. Let true remaining costs be h*(U)=5 and h*(V)=3, but use h(U)=5,h(V)=1. Both estimates are admissible, yet 5 > 2+1 violates consistency.", "trap": "“A* is always optimal” omits necessary heuristic, cost, termination, and duplicate-handling assumptions.", "q": "For edge cost 3 and h(V)=4, what is the greatest consistent h(U) on this edge?", "options": ["4", "7", "12"], "answer": 1, "why": "Consistency requires h(U)≤3+4=7.", "lab": "heuristic"}, {"unit": 2, "title": "AO*: AND–OR problem decomposition", "deck": "AO Star Algorithm.pdf", "body": "<p>Some tasks require solving several subproblems together. An <b>OR</b> choice succeeds through one alternative. An <b>AND</b> alternative succeeds only if all its required children succeed. A solution is a selected subgraph, not necessarily a single path.</p><p>For an OR node take the minimum of edge cost plus child estimate. For an AND alternative sum the costs of all required branches. If a node has alternative groups of children, take the minimum group sum.</p><p>AO* repeatedly follows the currently marked best partial solution, expands an unsolved tip, and backs updated costs up to ancestors. Mark solved alternatives when their required descendants are solved; propagate solved status. Stop when the root is solved, not merely when one terminal appears. These simple rules assume an acyclic AND–OR graph and additive subproblem costs; cycles and shared costs need extra care.</p>", "example": "Root can choose A alone, cost 1+h(A)=1+7=8; or choose both B and C, cost (1+2)+(1+3)=7. Mark the AND alternative. If expansion revises h(C) to 6, that alternative becomes 10 and the best choice switches to A.", "trap": "At an AND group, use a sum, not a minimum. All required subproblems must be solved.", "q": "An AND alternative has branch totals 4 and 6. Its total is…", "options": ["4", "6", "10"], "answer": 2, "why": "Independent required branch costs add.", "lab": "ao"}, {"unit": 2, "title": "Hill climbing & stochastic search", "deck": "Hill Climbing Algorithm.pdf", "body": "<p>Local search keeps a current candidate and moves through neighbouring candidates without necessarily retaining a full path. In maximisation, steepest-ascent hill climbing chooses the highest-valued neighbour and stops if no neighbour is strictly better.</p><p>A <b>local maximum</b> beats nearby states but not the global best. A <b>plateau</b> has equal values; a <b>ridge</b> can require moves poorly aligned with the neighbourhood. Changing the neighbourhood changes which optima are local.</p><p>Random-restart hill climbing repeats from different starts. Stochastic hill climbing chooses among improving moves, often probabilistically. Limited sideways moves can cross plateaus but require loop control. Simulated annealing sometimes accepts a worse move: for score change Δ&lt;0 and temperature T&gt;0, acceptance probability is exp(Δ/T). Cooling gradually reduces exploration; finite runs offer no unconditional guarantee of a global optimum.</p>", "example": "Scores [1,4,7,5,3,6,9,8], neighbours one index left/right: starting at 0 climbs to index 2 (score 7) and stops. Starting at 4 climbs right to index 6 (score 9). A restart can escape the first basin.", "trap": "Local search is not necessarily complete or optimal. A high score is good only if the objective correctly captures the task.", "q": "What is random restart intended to address?", "options": ["Local optima caused by the starting state", "The need for an objective function", "All possible memory limits"], "answer": 0, "why": "Different starts may enter different basins and reach better optima.", "lab": "hill"}, {"unit": 2, "title": "Constraint satisfaction & backtracking", "deck": "CSP.pdf", "body": "<p>A CSP consists of <b>variables X, domains D, and constraints C</b>. A solution is a complete assignment satisfying every constraint. Partial assignments must remain consistent.</p><p>Backtracking selects an unassigned variable, tries a legal value, recurses, and undoes the choice if no completion is possible. <b>MRV</b> selects the variable with fewest remaining legal values; the degree heuristic breaks ties by constraining the most unassigned neighbours. <b>LCV</b> tries the value eliminating the fewest choices for other variables.</p><p><b>Forward checking</b> removes incompatible values from unassigned neighbours after an assignment. <b>Arc consistency</b> requires every value in a variable’s domain to have some supporting value in the neighbouring domain. AC-3 revises arcs repeatedly and propagates deletions. A nonempty arc-consistent network need not have a global solution.</p>", "example": "A,B,C form a triangle with pairwise ≠ constraints and domains {red,green,blue}. Assign A=red, then B=green, leaving C=blue. With only {red,green}, the initial network is arc-consistent, yet the triangle is unsatisfiable.", "trap": "MRV chooses a variable; LCV chooses a value. Forward checking is weaker than enforcing full arc consistency.", "q": "Which statement is true?", "options": ["Arc consistency always proves a solution exists", "MRV selects the fewest-legal-values variable", "LCV selects the highest-degree variable"], "answer": 1, "why": "MRV is a variable-ordering heuristic; consistency filtering alone does not solve every CSP.", "lab": "csp"}, {"unit": 2, "title": "Minimax & alpha–beta pruning", "deck": "", "body": "<p>For a deterministic, alternating, two-player, zero-sum game with perfect information, minimax assumes optimal opposition. Terminal utilities are from MAX’s perspective. MAX nodes take the maximum child value; MIN nodes take the minimum. At a depth cutoff, substitute a heuristic evaluation for exact terminal utility.</p><p>Alpha–beta returns the same root minimax value while skipping branches that cannot affect the decision. <b>α</b> is the best lower bound already available to MAX; <b>β</b> is the best upper bound already available to MIN. Start with α=−∞, β=+∞. Update α at MAX, β at MIN; prune when α ≥ β.</p><p>Minimax takes O(b<sup>m</sup>) time. With ideal move ordering, alpha–beta can approach O(b<sup>m/2</sup>); worst-case ordering is still O(b<sup>m</sup>). Depth-first implementation uses O(bm) storage when retaining generated sibling lists, or O(m) with incremental generation. Pruned subtrees do not necessarily receive exact values.</p>", "example": "MAX has three MIN children with leaves [3,5], [2,9], [4,6]. Left-to-right: first MIN returns 3, so root α=3. At second MIN, seeing 2 gives β=2≤α; prune 9. Third MIN returns 4. MAX chooses the third branch with value 4.", "trap": "Pruning changes the amount of work, not the minimax root value. Move ordering changes how much is pruned.", "q": "At a MIN node, α=5 and the first child returns 3. What happens?", "options": ["Prune remaining children because β≤α", "Return 5 as the exact MIN value", "Increase α to 8"], "answer": 0, "why": "MIN is already at most 3; MAX has an alternative worth at least 5.", "lab": "minimax"}, {"unit": 3, "title": "Knowledge representation foundations", "deck": "Knowledge Representation.pdf", "body": "<p>A knowledge base (KB) stores sentences describing a domain. Representation provides vocabulary and structure; reasoning derives consequences. Ask what can be expressed, which inferences are valid, and how efficiently they can be found.</p><p><b>Syntax</b> specifies legal expressions. <b>Semantics</b> says what they mean in an interpretation. A model of a KB is an interpretation that makes all its sentences true. KB ⊨ α means every model of KB makes α true; KB ⊢ α means a proof procedure derives α.</p><p>A sound procedure derives only entailed conclusions. A complete procedure can derive every entailed conclusion in its target logic. Soundness and completeness describe a procedure, not how many facts the KB happens to contain.</p>", "example": "Let R mean rain and W mean wet. KB={R,R→W} entails W. KB={R→W} alone does not: R=false,W=false is a model of the rule where W is false.", "trap": "Entailment is about all models of the KB; truth in one chosen interpretation is insufficient.", "q": "What disproves KB ⊨ Q?", "options": ["One model where KB is true and Q is false", "One model where both are true", "An empty proof notebook"], "answer": 0, "why": "A single countermodel defeats the universal requirement in entailment.", "lab": ""}, {"unit": 3, "title": "Propositional logic & truth tables", "deck": "Knowledge Representation.pdf", "body": "<p>Atoms stand for whole statements. Build formulas using ¬ (not), ∧ (and), ∨ (inclusive or), → (implies), and ↔ (if and only if). P→Q is equivalent to ¬P∨Q, and is false only when P is true and Q is false.</p><p>A tautology is true in every interpretation; a contradiction is false in every interpretation; a contingent formula is true in some and false in others. Satisfiable means at least one model exists, so tautologies are also satisfiable.</p><p>To test KB ⊨ Q by a truth table, inspect only rows where every KB sentence is true. If Q is true on all those rows, entailment holds. With n distinct atoms there are 2ⁿ rows.</p>", "example": "For “If I revise, I pass”, R→P does not assert that I revise. If R is false, the implication is true regardless of P. R→P is equivalent to ¬P→¬R, but not to P→R.", "trap": "Affirming the consequent is invalid: P→Q and Q do not establish P.", "q": "When is P→Q false?", "options": ["P=false,Q=false", "P=true,Q=false", "P=false,Q=true"], "answer": 1, "why": "An implication fails only when its antecedent holds but its consequent does not.", "lab": "logic"}, {"unit": 3, "title": "CNF & propositional resolution", "deck": "Logic and Resolution - FOL.pdf", "body": "<p>A literal is an atom or its negation. A clause is a disjunction of literals. Conjunctive normal form (CNF) is a conjunction of clauses. Eliminate ↔ and →, push negations inward using De Morgan’s laws and double negation, then distribute ∨ over ∧.</p><p>Resolution combines (P∨A) and (¬P∨B) to obtain (A∨B). For a proof by refutation, add the negation of the target to the KB, convert to clauses, and derive the empty clause □. This proves the augmented set inconsistent and therefore establishes the target.</p><p>Keep each parent clause and pivot explicit. Resolve one complementary pair at a time. The empty clause is always false; an empty set of clauses is instead trivially satisfied.</p>", "example": "KB: P→Q, Q→R, P. Prove R. Clauses: (1) ¬P∨Q; (2) ¬Q∨R; (3) P; (4) ¬R [negated goal]. Resolve 1+3 → Q; Q+2 → R; R+4 → □.", "trap": "Failing to find a contradiction in a few steps is not evidence that the target is false.", "q": "What is the resolvent of P∨Q and ¬P∨R on P?", "options": ["Q∨R", "Q∧R", "P∨¬P"], "answer": 0, "why": "Remove the complementary P literals and disjoin the remaining literals.", "lab": "resolution"}, {"unit": 3, "title": "First-order logic & quantifiers", "deck": "First Order Logic.pdf", "body": "<p>FOL describes objects and relations. Constants name objects; variables range over the domain; functions return objects; predicates express truth-valued properties or relations. For example, Parent(ira,leo) is an atom and MotherOf(leo) is a term.</p><p>∀x means “for every x”; ∃x means “there is at least one x”. “All students read” is ∀x(Student(x)→Reads(x)). “Some student reads” is ∃x(Student(x)∧Reads(x)). A variable is bound inside its quantifier’s scope; a sentence has no free variables.</p><p>Quantifier order matters: ∀x∃y Likes(x,y) allows different choices of y for different x. ∃y∀x Likes(x,y) requires a single y liked by everybody. Negation swaps quantifiers: ¬∀x P(x) ≡ ∃x ¬P(x); ¬∃x P(x) ≡ ∀x ¬P(x).</p>", "example": "“Every student studies some subject”: ∀x(Student(x)→∃y(Subject(y)∧Studies(x,y))). “A subject is studied by every student”: ∃y(Subject(y)∧∀x(Student(x)→Studies(x,y))). The second makes a stronger shared-witness claim.", "trap": "Using implication inside ∃x(Student(x)→Reads(x)) can make a nonstudent a witness; it does not assert that a student reads.", "q": "Negate ∀x∃y Knows(x,y).", "options": ["∃x∀y ¬Knows(x,y)", "∀x∃y ¬Knows(x,y)", "∃y∀x Knows(x,y)"], "answer": 0, "why": "Push negation across each quantifier, swapping ∀ with ∃.", "lab": ""}, {"unit": 3, "title": "Unification & FOL resolution", "deck": "Logic and Resolution - FOL.pdf", "body": "<p>Unification finds substitutions making expressions identical. The most general unifier (MGU) avoids unnecessary bindings. Apply substitutions consistently to every occurrence of a variable.</p><p>To prepare FOL clauses: eliminate implications; move negations inward; standardise bound variables apart; Skolemise existential variables; drop implicit universal quantifiers; distribute into CNF and split clauses. An existential witness becomes a fresh constant if no universal variable is in scope, otherwise a fresh function of the universal variables in scope. Skolemisation preserves satisfiability, not ordinary equivalence in the same vocabulary.</p><p>Standardise clause variables apart before resolving. Unify complementary literals and apply the MGU to the remaining disjunction. Refutation resolution with appropriate factoring and a fair strategy is complete for first-order unsatisfiability, but may not terminate on satisfiable inputs.</p>", "example": "∀x(Human(x)→Mortal(x)), Human(ada), target Mortal(ada). Clauses ¬Human(x)∨Mortal(x), Human(ada), ¬Mortal(ada). With {x/ada}, derive Mortal(ada), then □. For ∀x∃y Parent(y,x), the witness becomes Parent(f(x),x).", "trap": "Unifying x with f(x) fails the occurs check in standard finite-term FOL. Also P(x,x) cannot unify with P(a,b) for distinct constants a,b.", "q": "What is an MGU of Likes(x,tea) and Likes(ira,y)?", "options": ["{x/ira,y/tea}", "{x/tea,y/ira}", "No unifier"], "answer": 0, "why": "Corresponding arguments must match, giving x=ira and y=tea.", "lab": "unify"}, {"unit": 3, "title": "Rules, forward & backward chaining", "deck": "", "body": "<p>A definite Horn rule has a conjunction of positive premises and one positive conclusion: A∧B→C. Facts are rules with no premises. A rule-based system combines facts, rules, and an inference mechanism.</p><p><b>Forward chaining</b> is data-driven: begin with known facts, repeatedly fire rules whose premises hold, and add new conclusions until the goal or a fixed point is reached. It suits deriving many consequences from incoming data.</p><p><b>Backward chaining</b> is goal-driven: start with a query, find rules that could conclude it, and prove their premises as subgoals using substitution and backtracking. It suits focused queries. Repeated-goal checks, tabling, or careful control help avoid loops.</p><p>A production system uses working memory, condition–action productions, and a control strategy. Its match–select–act cycle finds applicable rules, resolves conflicts, and executes a chosen rule. Action productions can change facts; they are not automatically identical to monotonic logical implications.</p>", "example": "Facts: Paid(ira), Registered(ira). Rules: Paid(x)∧Registered(x)→Eligible(x); Eligible(x)→Admitted(x). Forward: derive Eligible(ira), then Admitted(ira). Backward: to prove Admitted(ira), request Eligible(ira), then check Paid and Registered.", "trap": "Not finding a fact does not imply its negation in classical logic. A closed-world assumption is an additional modelling choice.", "q": "Which method starts with a query and reduces it to subgoals?", "options": ["Forward chaining", "Backward chaining", "Breadth-first traversal"], "answer": 1, "why": "Backward chaining works from a desired conclusion toward supporting premises.", "lab": ""}, {"unit": 3, "title": "Situation calculus & STRIPS", "deck": "", "body": "<p>Situation calculus represents changing worlds using actions, situations, and fluents. S₀ is the initial situation; do(a,s) denotes the situation resulting from action a in situation s. A fluent such as At(robot,room,s) can vary across situations.</p><p>Precondition axioms say when actions are possible; effect axioms describe changes. The frame problem asks how to express what remains unchanged efficiently. Successor-state axioms specify exactly when a fluent holds after an action, including persistence.</p><p>Classical STRIPS planning represents a state by facts and an action by preconditions, add effects, and delete effects. An action is applicable when its preconditions hold; the next state is <b>(S − Delete) ∪ Add</b>. Standard classical planning assumes a known, deterministic, fully observable setting with a closed-world state description.</p>", "example": "Move(A,B): preconditions {At(robot,A),Connected(A,B)}; delete {At(robot,A)}; add {At(robot,B)}. From {At(robot,A),Connected(A,B),Charged(robot)}, the result is {Connected(A,B),Charged(robot),At(robot,B)}. Charged persists because no effect deletes it.", "trap": "Delete lists remove facts rather than merely adding explicit negative statements. Check preconditions before applying effects.", "q": "An action deletes P and adds Q from state {P,R}. What is the successor?", "options": ["{P,Q,R}", "{Q,R}", "{Q}"], "answer": 1, "why": "Remove P, add Q, preserve unrelated R.", "lab": "strips"}, {"unit": 3, "title": "Semantic nets, frames, scripts & graphs", "deck": "Lecture  Semantic Nets Frames Conceptual Graphs.pdf", "body": "<p>A <b>semantic network</b> uses concept/object nodes and labelled relations. Distinguish instance-of (Tara is a particular bird) from subclass-of (birds are animals). Inheritance transfers applicable class properties to subclasses or instances, with an explicit policy needed for exceptions.</p><p>A <b>frame</b> packages a concept or situation into slots with fillers, constraints, defaults, and sometimes procedures. A Car frame might have colour, owner, wheels, and engine slots. Defaults describe typical values rather than universal truths.</p><p>A <b>script</b> describes a stereotyped event sequence, with roles, props, entry conditions, scenes, and results. A restaurant script can include entering, ordering, eating, and paying. It helps fill expected gaps but may fail on atypical events.</p><p>A <b>conceptual graph</b> explicitly represents concepts and their relations, often using separate concept and relation nodes. [Person: Ira]—(Agent)—[Read]—(Object)—[Book] expresses who performs an action on what. Formal meaning depends on the chosen representation convention.</p>", "example": "Tara instance-of Penguin; Penguin subclass-of Bird. A Bird frame may default flies=true, while Penguin overrides flies=false. Treating “all birds fly” as a strict logical rule would make this exception problematic; declare the default semantics.", "trap": "Semantic nets are not all formally equivalent. Label edge meanings and inheritance rules instead of assuming a drawing defines valid inference.", "q": "Which representation best captures a typical sequence of restaurant events?", "options": ["A script", "A single propositional atom", "A search frontier"], "answer": 0, "why": "Scripts organise stereotyped events, roles, and scenes.", "lab": ""}];

function home(){$('#screen').innerHTML=`<div class="hero"><div class="eyebrow">Learn it. Try it. Remember it.</div><h1>Your AI midsem,<br>one clear idea at a time.</h1><p class="lead">A hands-on path through agents, search, and knowledge representation. Read a short lesson, experiment, then check what stuck.</p><div class="row"><button class="primary" id="start">${state.done.length?'Continue learning':'Start learning'} →</button><button id="practiceHome">Try mixed practice</button><span class="pill">Units 1–3 only</span></div></div><div class="grid">${[1,2,3].map((u)=>`<section class="card"><span class="num">0${u} / ${lessons.filter(l=>l.unit===u).length} LESSONS</span><h3>${['','Think like an agent','Find a solution','Represent & reason'][u]}</h3><p>${['','AI foundations, PEAS, environments, and agent architectures.','Search algorithms, heuristics, constraints, and adversarial games.','Logic, resolution, rule systems, planning, and structured knowledge.'][u]}</p><button data-unit="${u}">Explore Unit ${u} →</button></section>`).join('')}</div><div class="callout"><b>Read → try → explain → recall</b><p>After each lesson, change the lab inputs, answer the checkpoint, and write the idea in your own words. Mark completion when you can solve a fresh example without looking.</p></div><h2>A practical study sequence</h2><ol><li><b>Foundations:</b> distinguish rationality, PEAS, and environment dimensions.</li><li><b>Search:</b> trace the frontier by hand; then practise A*, CSPs, and pruning.</li><li><b>Reasoning:</b> translate English into logic and write complete resolution proofs.</li><li><b>Recall:</b> use the quick sheet, flashcards, and mixed questions to find weak spots.</li></ol><p class="muted">Includes syllabus supplements on production systems, situation calculus, STRIPS, scripts, and chaining. Units 4–5 are excluded. Works offline; lecture links need internet. Progress and notes stay in this browser when local storage is available.</p>${footer()}`;$('#start').onclick=()=>go(lessons.findIndex((l,i)=>!state.done.includes(i))<0?0:lessons.findIndex((l,i)=>!state.done.includes(i)));$('#practiceHome').onclick=()=>go(-2);document.querySelectorAll('[data-unit]').forEach(b=>b.onclick=()=>go(lessons.findIndex(l=>l.unit===+b.dataset.unit)));}
function link(l){return l.deck?'https://parthapakray.com/ai/2023/'+encodeURIComponent(l.deck):'https://parthapakray.com/ug2026.html'}
function lesson(i){const l=lessons[i];$('#screen').innerHTML=`<div class="eyebrow">Unit ${l.unit} / Lesson ${i+1} of ${lessons.length}</div><h1>${l.title}</h1><p class="source">${l.deck?`<a href="${link(l)}" target="_blank" rel="noopener">Open original lecture ↗</a>`:i===12?'Course lists this as an on-board lecture; no downloadable Minimax notes are linked.':'Syllabus supplement · no separate lecture file is linked for this topic.'}</p><article class="studytext">${l.body}</article><h2>Worked example</h2><div class="callout">${l.example}</div>${l.lab?'<section class="lab"><div class="lab-title"><span>TRY IT</span><h3>Make the idea move</h3></div><div id="lab"></div></section>':''}<div class="callout warning"><b>Watch out</b><p>${l.trap}</p></div><section class="lab"><div class="eyebrow">Check your understanding</div><h3>${l.q}</h3><div class="options" id="checkpoint">${l.options.map((o,j)=>`<button data-answer="${j}">${String.fromCharCode(65+j)}. ${o}</button>`).join('')}</div><div id="feedback" class="feedback" aria-live="polite"></div></section><details><summary>Explain it without looking</summary><p>Define ${l.title.toLowerCase()} in your own words. Reconstruct the worked example, identify the key assumption, and explain why the common mistake is wrong.</p></details><h2>Your notes</h2><label for="notes" class="muted">Capture the rule, a doubt, or a solved example.</label><textarea class="notes" id="notes" placeholder="The key idea is…">${esc(state.notes[i]||'')}</textarea><span id="saveStatus">${storageOK?'Notes save locally as you type.':'Local storage unavailable.'}</span><div class="bottom"><button id="prev" ${i===0?'disabled':''}>← Previous</button><button id="complete" class="primary">${state.done.includes(i)?'✓ Completed · mark unread':'Mark as completed'}</button><button id="next">${i===lessons.length-1?'Mixed practice':'Next lesson'} →</button></div>${footer()}`;
$('#checkpoint').querySelectorAll('button').forEach(b=>b.onclick=()=>{let a=+b.dataset.answer;state.answers[i]=a;save();$('#checkpoint').querySelectorAll('button').forEach((btn,j)=>btn.className=j===l.answer?'correct':j===a?'incorrect':'');$('#feedback').textContent=(a===l.answer?'Correct. ':'Not quite. ')+l.why;});$('#notes').oninput=e=>{state.notes[i]=e.target.value;save()};$('#prev').onclick=()=>go(i-1);$('#next').onclick=()=>go(i===lessons.length-1?-2:i+1);$('#complete').onclick=()=>{state.done=state.done.includes(i)?state.done.filter(n=>n!==i):[...state.done,i];save();nav();$('#complete').textContent=state.done.includes(i)?'✓ Completed · mark unread':'Mark as completed'};if(l.lab)labs[l.lab]();}

labs.env=()=>{$('#lab').innerHTML='<p>Classifications depend on the task model. Compare these examples.</p><label>Task <select id="task"><option>Chess with a clock</option><option>Taxi driving</option><option>Static image classification</option><option>Poker</option><option>Crossword puzzle</option><option>Interactive tutoring</option></select></label><div class="result" id="envOut" aria-live="polite"></div>';const rows=[['Full','Deterministic rules / strategic opponent','Sequential','Semidynamic','Discrete moves; continuous clock','Multi-agent'],['Partial','Stochastic','Sequential','Dynamic','Mostly continuous','Multi-agent'],['Full for the given image; semantic label may be uncertain','Deterministic fixed dataset model','Episodic','Static','Discrete outputs; pixel inputs','Single-agent'],['Partial','Stochastic dealing / strategic play','Sequential','Static during a turn if untimed','Discrete','Multi-agent'],['Full','Deterministic','Sequential (crossing words interact)','Static','Discrete','Single-agent'],['Partial (student knowledge is hidden)','Stochastic student response','Sequential','Dynamic if student state changes during deliberation','Mixed','Multi-agent']];function draw(){$('#envOut').innerHTML=rows[$('#task').selectedIndex].map((v,i)=>'<div><b>'+['Observability','Transition','Dependency','Time','Representation','Agents'][i]+':</b> '+v+'</div>').join('')}$('#task').onchange=draw;draw()};

function searchTrace(mode){let f=[{n:'S',g:0,path:['S']}],best={S:0},closed=new Set(),seq=0,trace=[];while(f.length&&trace.length<30){if(mode==='UCS'||mode==='A*'||mode==='Greedy')f.sort((a,b)=>(mode==='UCS'?a.g:mode==='A*'?a.g+heur[a.n]:heur[a.n])-(mode==='UCS'?b.g:mode==='A*'?b.g+heur[b.n]:heur[b.n])||a.seq-b.seq);let x=f.shift();if(closed.has(x.n))continue;closed.add(x.n);let msg=x.n==='G'?'Goal popped. Route '+x.path.join(' → ')+'; cost '+x.g+'.':'Expand '+x.n+' at g='+x.g+'.';if(x.n!=='G'){let next=[];for(const [n,c]of graph[x.n]){let g=x.g+c;if(closed.has(n))continue;if((mode==='UCS'||mode==='A*')&&best[n]!==undefined&&best[n]<=g)continue;if((mode==='BFS'||mode==='Greedy')&&f.some(e=>e.n===n))continue;best[n]=g;f=f.filter(e=>e.n!==n);next.push({n,g,path:[...x.path,n],seq:++seq})}f=mode==='DFS'?[...next,...f]:[...f,...next];if(['UCS','A*','Greedy'].includes(mode))f.sort((a,b)=>(mode==='UCS'?a.g:mode==='A*'?a.g+heur[a.n]:heur[a.n])-(mode==='UCS'?b.g:mode==='A*'?b.g+heur[b.n]:heur[b.n])||a.seq-b.seq)}trace.push({msg,closed:[...closed],f:f.map(e=>`${e.n} (g=${e.g}${mode==='A*'?', f='+(e.g+heur[e.n]):mode==='Greedy'?', h='+heur[e.n]:''})`),path:x.path});if(x.n==='G')break;}return trace}
labs.search=()=>{$('#lab').innerHTML='<p>One directed weighted graph, five frontier rules. Ties use insertion order; children are considered left to right. Graph search tracks reached states.</p><pre>S ─1→ A ─2→ C ─5→ G\n│     └────────9→ G\n└─4→ B ─────────1→ G\nHeuristics: S=5, A=7, B=1, C=5, G=0</pre><label>Algorithm <select id="algo">'+['BFS','DFS','UCS','Greedy','A*'].map(x=>'<option>'+x+'</option>').join('')+'</select></label><div class="row"><button id="stepBack">← Step</button><button class="primary" id="step">Next expansion →</button><button id="resetSearch">Reset</button></div><div class="result" id="trace" aria-live="polite"></div>';let idx=-1,steps=[];function draw(){let t=steps[idx];$('#trace').innerHTML=t?'<b>Step '+(idx+1)+'</b> · '+t.msg+'<p>Expanded: '+t.closed.join(' → ')+'</p><p>Frontier (next first): '+(t.f.join(' | ')||'empty')+'</p>':'Ready. Frontier: S (g=0). Predict the first expansion.';$('#step').disabled=idx===steps.length-1;$('#stepBack').disabled=idx<0}function reset(){steps=searchTrace($('#algo').value);idx=-1;draw()}$('#step').onclick=()=>{idx++;draw()};$('#stepBack').onclick=()=>{idx--;draw()};$('#algo').onchange=reset;$('#resetSearch').onclick=reset;reset()};
labs.heuristic=()=>{$('#lab').innerHTML='<p>Test the local consistency inequality h(U) ≤ cost(U,V)+h(V). This checks one edge only, not global admissibility.</p><div class="row"><label>h(U) <input id="hu" type="number" min="0" value="5"></label><label>Edge cost <input id="hc" type="number" min="0" value="2"></label><label>h(V) <input id="hv" type="number" min="0" value="1"></label></div><div class="result" id="hout" aria-live="polite"></div>';function calc(){const ids=['hu','hc','hv'];if(ids.some(id=>!$('#'+id).validity.valid||$('#'+id).value==='')){$('#hout').textContent='Enter three nonnegative numbers.';return}let [u,c,v]=ids.map(id=>+$('#'+id).value);$('#hout').textContent=`${u} ≤ ${c} + ${v} = ${c+v}: ${u<=c+v?'consistent on this edge.':'inconsistent on this edge.'} `+(u>c+v?'The estimated f can drop when moving from U to V.':'Check every edge before calling the heuristic consistent.')}['hu','hc','hv'].forEach(id=>$('#'+id).oninput=calc);calc()};
labs.ao=()=>{$('#lab').innerHTML='<p>Root chooses A alone OR the pair (B AND C). Every root-to-child edge costs 1. Change the estimated subproblem costs.</p><div class="row">'+['A','B','C'].map((x,i)=>`<label>h(${x}) <input type="number" min="0" id="ao${x}" value="${[7,2,3][i]}"></label>`).join('')+'</div><div class="result" id="aoOut" aria-live="polite"></div>';function calc(){let els=['A','B','C'].map(x=>$('#ao'+x));if(els.some(e=>!e.validity.valid||e.value==='')){$('#aoOut').textContent='Enter nonnegative costs.';return}let[a,b,c]=els.map(e=>+e.value);$('#aoOut').innerHTML=`A alone = 1 + ${a} = <b>${1+a}</b><br>B AND C = (1 + ${b}) + (1 + ${c}) = <b>${2+b+c}</b><p>Marked alternative: <b>${a+1<2+b+c?'A alone':a+1>2+b+c?'B AND C':'tie — either alternative'}</b>. These estimates select a partial solution; expansion and solved-status propagation are still required.</p>`}['A','B','C'].forEach(x=>$('#ao'+x).oninput=calc);calc()};
labs.hill=()=>{$('#lab').innerHTML='<p>Maximise the score. Only adjacent indices are neighbours; each move must strictly improve. Change the start to explore a different basin.</p><label>Start index <select id="hillStart">'+Array.from({length:8},(_,i)=>'<option>'+i+'</option>').join('')+'</select></label><button class="primary" id="hillStep">Climb one step</button><div class="nodes" id="landscape"></div><div class="result" id="hillOut" aria-live="polite"></div>';let scores=[1,4,7,5,3,6,9,8],pos=0,path=[0];function draw(){let neighbours=[pos-1,pos+1].filter(x=>x>=0&&x<8);let best=neighbours.reduce((a,b)=>scores[b]>scores[a]?b:a,pos);$('#landscape').innerHTML=scores.map((s,i)=>`<div class="node bar ${i===pos?'current':''}" style="height:${s*12+30}px">${i===pos?'● ':''}${i}<br>${s}</div>`).join('');$('#hillOut').textContent='Path: '+path.join(' → ')+'. Current score '+scores[pos]+'. '+(best===pos?'Stopped at '+(scores[pos]===9?'the global maximum.':'a local maximum; try starting at 4.'):'A better neighbour exists.');$('#hillStep').disabled=best===pos;$('#hillStep').onclick=()=>{pos=best;path.push(pos);draw()}}$('#hillStart').onchange=()=>{pos=+$('#hillStart').value;path=[pos];draw()};draw()};
labs.csp=()=>{$('#lab').innerHTML='<p>A, B, C form a triangle. Every pair must have different colours. Assign a colour and inspect remaining legal values.</p><div class="row">'+['A','B','C'].map(x=>`<label>${x} <select id="csp${x}"><option value="">Unassigned</option><option>Red</option><option>Green</option><option>Blue</option></select></label>`).join('')+'</div><div class="result" id="cspOut" aria-live="polite"></div>';function calc(){let vs=['A','B','C'].map(x=>$('#csp'+x).value),assigned=vs.filter(Boolean),conflict=new Set(assigned).size!==assigned.length;$('#cspOut').innerHTML='<b>'+(conflict?'Constraint violated: adjacent vertices share a colour.':assigned.length===3?'Solved: complete and consistent.':'Consistent partial assignment.')+'</b><br>'+vs.map((v,i)=>v?['A','B','C'][i]+' = '+v:['A','B','C'][i]+' remaining: '+(['Red','Green','Blue'].filter(c=>!assigned.includes(c)).join(', ')||'empty')).join('<br>')}['A','B','C'].forEach(x=>$('#csp'+x).onchange=calc);calc()};
labs.minimax=()=>{$('#lab').innerHTML='<p>MAX → three MIN branches → two terminal values per branch. Edit leaves and compare exact minimax with left-to-right alpha–beta.</p><div class="row">'+[3,5,2,9,4,6].map((v,i)=>`<label>Leaf ${i+1} <input type="number" id="leaf${i}" value="${v}" min="-999" max="999"></label>`).join('')+'</div><div class="result" id="mmOut" aria-live="polite"></div>';function calc(){let es=Array.from({length:6},(_,i)=>$('#leaf'+i));if(es.some(e=>!e.validity.valid||e.value==='')){$('#mmOut').textContent='Enter six values between −999 and 999.';return}let v=es.map(e=>+e.value),mins=[0,1,2].map(i=>Math.min(v[2*i],v[2*i+1])),alpha=-Infinity,log=[],count=0;for(let j=0;j<3;j++){let beta=v[2*j];count++;if(beta<=alpha)log.push(`Branch ${j+1}: see ${beta}; β=${beta} ≤ α=${alpha}, prune leaf ${j*2+2}.`);else{count++;beta=Math.min(beta,v[2*j+1]);log.push(`Branch ${j+1}: inspect both leaves; MIN=${beta}.`)}alpha=Math.max(alpha,beta)}$('#mmOut').innerHTML=`<b>Exact MIN values: ${mins.join(', ')} → MAX = ${Math.max(...mins)}</b><p>${log.join('<br>')}</p>Alpha–beta root value: <b>${alpha}</b>. Evaluated ${count}/6 leaves. Choose branch ${mins.indexOf(Math.max(...mins))+1} (first best on ties).`}Array.from({length:6},(_,i)=>$('#leaf'+i)).forEach(e=>e.oninput=calc);calc()};
labs.logic=()=>{$('#lab').innerHTML='<p>Select a formula. All four interpretations update; toggle P and Q to highlight the current one.</p><label>Formula <select id="formula"><option>P → Q</option><option>P ↔ Q</option><option>P ∧ Q</option><option>P ∨ Q</option><option>(P → Q) ∧ P</option><option>(P → Q) ∧ ¬Q</option></select></label><div class="row"><label><input type="checkbox" id="pval" checked>P is true</label><label><input type="checkbox" id="qval">Q is true</label></div><div class="result" id="truth" aria-live="polite"></div>';function calc(){let k=$('#formula').selectedIndex,fn=[(p,q)=>!p||q,(p,q)=>p===q,(p,q)=>p&&q,(p,q)=>p||q,(p,q)=>(!p||q)&&p,(p,q)=>(!p||q)&&!q][k],p=$('#pval').checked,q=$('#qval').checked;$('#truth').innerHTML='<b>Current result: '+(fn(p,q)?'TRUE':'FALSE')+'</b><table><tr><th>P</th><th>Q</th><th>Formula</th></tr>'+[[true,true],[true,false],[false,true],[false,false]].map(([a,b])=>`<tr ${a===p&&b===q?'class="correct"':''}><td>${a?'T':'F'}</td><td>${b?'T':'F'}</td><td>${fn(a,b)?'T':'F'}${a===p&&b===q?' ← current':''}</td></tr>`).join('')+'</table>'}['formula','pval','qval'].forEach(x=>$('#'+x).onchange=calc);calc()};
labs.resolution=()=>{$('#lab').innerHTML='<p>Prove R from P→Q, Q→R, and P. Reveal one proof step at a time; predict each resolvent before continuing.</p><pre id="resText"></pre><button class="primary" id="resNext">Reveal next step</button><button id="resReset">Reset</button>';const steps=['1. ¬P ∨ Q     [premise in CNF]','2. ¬Q ∨ R     [premise in CNF]','3. P          [fact]','4. ¬R         [negated goal]','5. Q          [resolve 1,3 on P]','6. R          [resolve 2,5 on Q]','7. □          [resolve 4,6 on R]\nContradiction: the original KB entails R.'];let n=4;function draw(){$('#resText').textContent=steps.slice(0,n).join('\n');$('#resNext').disabled=n===7}$('#resNext').onclick=()=>{n++;draw()};$('#resReset').onclick=()=>{n=4;draw()};draw()};
labs.unify=()=>{$('#lab').innerHTML='<p>Choose a pair and inspect the substitution or reason for failure.</p><label>Pair <select id="pair"><option>Likes(x,tea) / Likes(ira,y)</option><option>P(x,x) / P(a,b)</option><option>P(x) / P(f(x))</option><option>Knows(x,f(y)) / Knows(ira,f(leo))</option></select></label><div class="result" id="unifyOut" aria-live="polite"></div>';const answers=['MGU {x/ira, y/tea}. Both become Likes(ira,tea).','No unifier: x would have to be both distinct constants a and b.','No finite-term unifier: x=f(x) fails the occurs check.','MGU {x/ira, y/leo}. Match the outer predicate, then corresponding terms.'];function draw(){$('#unifyOut').textContent=answers[$('#pair').selectedIndex]}$('#pair').onchange=draw;draw()};
labs.strips=()=>{$('#lab').innerHTML='<p>Move(A,B) requires At(robot,A) and Connected(A,B), deletes At(robot,A), and adds At(robot,B).</p><label><input type="checkbox" id="atA" checked>At(robot,A)</label><label><input type="checkbox" id="connected" checked>Connected(A,B)</label><label><input type="checkbox" id="charged" checked>Charged(robot)</label><div class="result" id="stripsOut" aria-live="polite"></div>';function draw(){let a=$('#atA').checked,c=$('#connected').checked;$('#stripsOut').textContent=!a||!c?'Action not applicable: missing '+[!a?'At(robot,A)':'',!c?'Connected(A,B)':''].filter(Boolean).join(' and ')+'.':'Successor = {At(robot,B), Connected(A,B)'+($('#charged').checked?', Charged(robot)':'')+'}. Unrelated facts persist.'}['atA','connected','charged'].forEach(x=>$('#'+x).onchange=draw);draw()};
function practice(){let pool=[...lessons.keys()].sort(()=>Math.random()-.5).slice(0,10),pos=0,score=0,answered=false;function draw(){let l=lessons[pool[pos]];$('#screen').innerHTML=`<div class="eyebrow">Retrieval practice / Units 1–3</div><h1>Can you explain the choice?</h1><p class="lead">Ten questions from the lesson bank. Answers appear after each attempt. This is a revision drill, not a predicted exam.</p><div class="row"><span class="pill">Question ${pos+1} / ${pool.length}</span><span>Score: ${score} / ${pos}</span></div><section class="lab"><p class="muted">Unit ${l.unit} · ${l.title}</p><h2>${l.q}</h2><div class="options">${l.options.map((o,j)=>`<button data-pick="${j}">${o}</button>`).join('')}</div><div id="drillFeedback" class="feedback" aria-live="polite"></div><button id="drillNext" class="primary" style="margin-top:20px" disabled>${pos===9?'See result':'Next question'} →</button></section>${footer()}`;answered=false;document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{if(answered)return;answered=true;let a=+b.dataset.pick;if(a===l.answer)score++;document.querySelectorAll('[data-pick]').forEach(btn=>{btn.disabled=true;btn.className=+btn.dataset.pick===l.answer?'correct':btn===b?'incorrect':''});$('#drillFeedback').textContent=(a===l.answer?'Correct. ':'Not quite. ')+l.why;$('#drillNext').disabled=false});$('#drillNext').onclick=()=>{pos++;if(pos===pool.length){$('#screen').innerHTML=`<div class="eyebrow">Practice complete</div><h1>${score} / ${pool.length}</h1><p class="lead">${score>=8?'Strong recall. Now reconstruct the worked examples on paper.':'Revisit the lessons that felt uncertain, then try another set.'}</p><button class="primary" id="retryDrill">New practice set</button><h2>Next: practise full answers</h2>${written()}${footer()}`;$('#retryDrill').onclick=practice}else draw()}}draw()}
function written(){return `<details><summary>1. Compare BFS, UCS, and A* (suggested 6-mark practice)</summary><p>Give priorities depth/g/g+h; data structures queue/priority queue; completeness and optimality conditions; memory costs; and a weighted example where BFS differs from UCS. Mention goal-test timing for UCS/A*.</p></details><details><summary>2. Design an automated taxi agent (suggested 6-mark practice)</summary><p>Specify all four PEAS components; classify each environment dimension with assumptions; select model-based and utility-based decision features; explain partial observability and safety/time tradeoffs.</p></details><details><summary>3. Write a complete FOL refutation (suggested 8-mark practice)</summary><p>Given ∀x(Student(x)→Learns(x)) and Student(ira), prove Learns(ira). CNF: ¬Student(x)∨Learns(x); Student(ira); ¬Learns(ira). Unifier {x/ira}. Resolve the first two to Learns(ira), then resolve with the negated goal to □. Label premises, substitution, parents, and conclusion.</p></details><details><summary>4. Trace a CSP (suggested 6-mark practice)</summary><p>Define a three-variable triangle colouring CSP. Show domains and ≠ constraints, select a variable by MRV/degree, try values with LCV, and show forward-checking updates. Explain why the two-colour version has no solution despite initial arc consistency.</p></details>`}
function cards(){let order=[...lessons.keys()],p=0,flipped=false;function draw(){let l=lessons[order[p]];$('#screen').innerHTML=`<div class="eyebrow">Active recall / ${p+1} of ${order.length}</div><h1>Say it before you flip it.</h1><p class="muted">Unit ${l.unit} · ${l.title}</p><div class="flash" aria-live="polite">${flipped?esc(l.options[l.answer])+'<p class="muted">'+l.why+'</p>':l.q}</div><div class="row"><button id="cardPrev" ${p===0?'disabled':''}>← Previous</button><button class="primary" id="flip">${flipped?'Show question':'Reveal answer'}</button><button id="cardNext" ${p===order.length-1?'disabled':''}>Next →</button><button id="shuffle">Shuffle</button><button id="reviewCard">Read lesson</button></div>${footer()}`;$('#flip').onclick=()=>{flipped=!flipped;draw()};$('#cardPrev').onclick=()=>{p--;flipped=false;draw()};$('#cardNext').onclick=()=>{p++;flipped=false;draw()};$('#shuffle').onclick=()=>{for(let i=order.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}p=0;flipped=false;draw()};$('#reviewCard').onclick=()=>go(order[p])}draw()}
function sheet(){return `<h2>Search: what decides the next node?</h2><div class="table-wrap"><table><thead><tr><th>Method</th><th>Priority / structure</th><th>Key guarantee or limitation</th></tr></thead><tbody><tr><td>BFS</td><td>Shallowest / FIFO</td><td>Complete with finite branching; optimal for equal step costs.</td></tr><tr><td>DFS</td><td>Deepest / stack</td><td>Not generally optimal; tree search can get trapped.</td></tr><tr><td>IDS</td><td>Repeated depth-limited DFS</td><td>Complete with finite branching; optimal for equal step costs.</td></tr><tr><td>UCS</td><td>Minimum g / priority queue</td><td>Optimal with nonnegative costs; infinite-space completeness needs conditions such as costs ≥ ε &gt; 0.</td></tr><tr><td>Greedy</td><td>Minimum h / priority queue</td><td>Not generally optimal or complete on infinite spaces; finite graph search with duplicate control is complete.</td></tr><tr><td>A*</td><td>Minimum g+h / priority queue</td><td>Admissible tree search; consistent graph search without reopenings, or admissible with reopenings; usual cost/termination assumptions.</td></tr><tr><td>AO*</td><td>Best marked AND–OR solution</td><td>OR: choose minimum; AND: add required branch costs.</td></tr></tbody></table></div><h2>Formulas worth retrieving from memory</h2><pre>A*: f(n) = g(n) + h(n)
Admissible: 0 ≤ h(n) ≤ h*(n)
Consistent: h(n) ≤ c(n,n′) + h(n′); h(goal)=0
Alpha–beta cutoff: α ≥ β
STRIPS: S′ = (S − Delete) ∪ Add
Implication: P → Q ≡ ¬P ∨ Q
Contrapositive: P → Q ≡ ¬Q → ¬P
De Morgan: ¬(P ∧ Q) ≡ ¬P ∨ ¬Q
Quantifier negation: ¬∀x P(x) ≡ ∃x ¬P(x)
Resolution: (P∨A), (¬P∨B) ⟹ (A∨B)
Refutation: KB ∧ ¬goal ⟹ □</pre><h2>Exam-answer checklist</h2><ul><li><b>Algorithm trace:</b> specify tie order, goal-test timing, graph/tree variant, frontier, reached states, and final path/cost.</li><li><b>Agent question:</b> write PEAS first; justify architecture and each environment classification.</li><li><b>CSP:</b> define variables, domains, and constraints before tracing assignments.</li><li><b>Logic proof:</b> translate carefully; negate target; show CNF, unifiers, parent clauses, and □.</li><li><b>Comparison:</b> name the selection rule, guarantees with assumptions, time, space, and use case.</li></ul><h2>Full-answer practice</h2>${written()}`}
function quick(){$('#screen').innerHTML='<div class="eyebrow">The last-pass revision sheet</div><h1>Rules, assumptions,<br>and common slips.</h1><p class="lead">Use this after the lessons. A remembered formula helps only if you can explain when it applies.</p>'+sheet()+footer()}
function sources(){const base='https://parthapakray.com/ai/2023/',rows=[
[1,'Introduction to AI',0,'Introduction to AI.pdf'],[1,'Agent and Environment',1,'Agent and Environment.pdf'],[1,'Environment Various Types',2,'https://parthapakray.com/ai/2026/ai-environment-types.html'],[1,'Agent Classifications',3,'Agent Classifications.pdf'],[1,'Environment Classifications',2,'Agent and Environment.pdf'],[2,'Problem Solving using Search (Single agent search)',4,'State Space Search.pdf'],[2,'Uninformed Search',5,'Uninformed Search.pdf'],[2,'Uniform-Cost Search Algorithm',6,'ucs.html'],[2,'Informed Search',7,'Informed Search.pdf'],[2,'AO* Algorithm',9,'AO Star Algorithm.pdf'],[2,'Hill Climbing',10,'Hill Climbing Algorithm.pdf'],[2,'Hill Climbing — additional example',10,'Lecture on Hill Climbing Algorithm.pdf'],[2,'Constraint Satisfaction Problems',11,'CSP.pdf'],[2,'CSP Introduction — Stanford',11,'https://web.stanford.edu/class/cs227/Lectures/lec14.pdf'],[2,'MINIMAX and Alpha-Beta Pruning Algorithm',12,''],[3,'Knowledge Representation – Propositional Logic',14,'Knowledge Representation.pdf'],[3,'First Order Logic',16,'First Order Logic.pdf'],[3,'Logic and Resolution – FOL',17,'Logic and Resolution - FOL.pdf'],[3,'FOL examples',17,'https://parthapakray.com/ai/2024/fol.txt'],[3,'Resolution examples',17,'Resolution Examples.pdf'],[3,'Semantic Nets, Frames, Conceptual Graphs',20,'Lecture  Semantic Nets Frames Conceptual Graphs.pdf']];$('#screen').innerHTML=`<div class="eyebrow">Traceable to your course</div><h1>Lecture map & sources</h1><p class="lead">The page order is rearranged into Units 1–3. Related environment lectures share a lesson; longer logic topics are split into smaller steps.</p><p><a href="https://parthapakray.com/ug2026.html" target="_blank" rel="noopener">CS 401 syllabus and Class PPTs and Notes ↗</a></p><div class="callout"><b>How this guide was made</b><p>The course syllabus, topic list, and lecture links were checked on 16 September 2026. Selected accessible material on informed search, propositional logic, FOL resolution, and CSP was consulted. This is an original syllabus-aligned tutorial, not a transcription or exhaustive verification of every slide. Examples, labs, and practice questions are newly written.</p><p>Minimax is listed as an on-board lecture dated 24/10/2025, with a placeholder link. Production systems, chaining, situation calculus, STRIPS, and scripts are included because the syllabus lists them even without a separate titled lecture link. Midsem scope follows your instruction, rather than a verified examination notice.</p></div><div class="table-wrap"><table><thead><tr><th>Unit</th><th>Course material</th><th>Study</th></tr></thead><tbody>${rows.map(([u,t,i,f])=>`<tr><td>${u}</td><td>${f?`<a href="${f.startsWith('https:')?f:base+encodeURIComponent(f)}" target="_blank" rel="noopener">${t} ↗</a>`:t+'<br><small>On-board entry; no file linked.</small>'}</td><td><button data-read="${i}">Lesson ${i+1}</button></td></tr>`).join('')}</tbody></table></div><h2>Excluded from this midsem guide</h2><ul><li>Unit 5: Natural Language Processing; Language Model; Language Model with Smoothing; NLP Applications — Large Language Models.</li><li>Unit 4: Uncertain Knowledge and Reasoning, confidence factors, and Bayes theorem.</li></ul><h2>Your study data</h2><p>Completion and notes use this browser’s local storage. Moving or renaming the HTML file, changing browser profiles, private mode, or clearing browser data can affect retention. Export a backup for portability.</p><div class="row"><button id="export">Export notes & progress</button><label>Restore backup <input type="file" id="import" accept="application/json,.json"></label></div><div id="backupStatus" aria-live="polite"></div>${footer()}`;document.querySelectorAll('[data-read]').forEach(b=>b.onclick=()=>go(+b.dataset.read));$('#export').onclick=()=>{let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='ai-studio-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('#import').onchange=async e=>{try{let f=e.target.files[0];if(!f)return;let s=JSON.parse(await f.text());if(!Array.isArray(s.done)||!s.notes||typeof s.notes!=='object'||Array.isArray(s.notes)||!s.answers||typeof s.answers!=='object')throw Error();let cleanNotes={};for(let [k,v]of Object.entries(s.notes))if(Number.isInteger(+k)&&+k>=0&&+k<lessons.length&&typeof v==='string')cleanNotes[k]=v;state={...state,done:[...new Set(s.done.filter(i=>Number.isInteger(i)&&i>=0&&i<lessons.length))],notes:{...state.notes,...cleanNotes},answers:{...state.answers,...s.answers}};save();nav();$('#backupStatus').textContent='Backup restored; existing notes were merged.'}catch(err){$('#backupStatus').textContent='Could not restore: choose an AI Studio JSON backup.'}}}
$('#filter').oninput=nav;$('#theme').onclick=()=>{state.theme=!state.theme;document.body.classList.toggle('dark',state.theme);save()};$('#menu').onclick=()=>{$('#sidebar').classList.toggle('open');$('#menu').setAttribute('aria-expanded',$('#sidebar').classList.contains('open'))};$('#print').onclick=()=>{$('#printArea').innerHTML='<h1>AI Studio · CS 401</h1><p>Units 1–3 · Complete lesson notes and revision sheet. Original teaching material aligned to https://parthapakray.com/ug2026.html; scope supplied by the student.</p>'+sheet()+lessons.map((l,i)=>`<section class="print-lesson"><p>UNIT ${l.unit} / LESSON ${i+1}</p><h1>${l.title}</h1>${l.body}<h2>Worked example</h2><p>${l.example}</p><p><b>Watch out:</b> ${l.trap}</p><h2>Checkpoint</h2><p>${l.q}</p><p><b>Answer:</b> ${l.options[l.answer]} ${l.why}</p>${state.notes[i]?'<h2>Your notes</h2><p style="white-space:pre-wrap">'+esc(state.notes[i])+'</p>':''}<p>Reference: ${link(l)}</p></section>`).join('');window.print()};
function route(){const h=location.hash.slice(1),names=['home','practice','cards','quick','sources'];let i=h.startsWith('lesson-')?Number(h.slice(7))-1:-(names.indexOf(h)+1);if(!h||!Number.isInteger(i)||i>=lessons.length||i< -5||(!h.startsWith('lesson-')&&!names.includes(h)))i=-1;go(i)}window.addEventListener('hashchange',()=>{let expected=current<0?['home','practice','cards','quick','sources'][-current-1]:'lesson-'+(current+1);if(location.hash.slice(1)!==expected)route()});route();
</script></body></html>

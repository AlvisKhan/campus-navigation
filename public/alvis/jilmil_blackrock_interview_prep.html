<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>BlackRock SWE Intern — Interview Prep</title>
<style>
  :root{
    --bg:#080c14;
    --bg-elev:#0e1526;
    --bg-elev-2:#131c33;
    --border:#22304d;
    --border-soft:#1a2439;
    --text:#e8ecf5;
    --text-dim:#9aa8c7;
    --text-faint:#5d6c8f;
    --accent:#5b93ff;
    --accent-dim:#3a5fa8;
    --accent-soft:rgba(91,147,255,0.12);
    --gold:#cba869;
    --gold-soft:rgba(203,168,105,0.14);
    --good:#3fcf8e;
    --serif: Georgia, 'Iowan Old Style', 'Times New Roman', serif;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--sans);
    font-size:15px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--accent-soft);}
  a{color:var(--accent);}

  /* ===== Layout ===== */
  .app{display:flex;min-height:100vh;}

  .sidebar{
    width:250px;
    flex-shrink:0;
    background:var(--bg-elev);
    border-right:1px solid var(--border-soft);
    display:flex;
    flex-direction:column;
    position:fixed;
    top:0;left:0;bottom:0;
    z-index:40;
    transition:transform .25s ease;
  }
  .brand{
    padding:22px 20px 16px;
    border-bottom:1px solid var(--border-soft);
  }
  .brand .mark{
    font-family:var(--serif);
    font-size:19px;
    letter-spacing:.2px;
    color:var(--text);
  }
  .brand .mark b{color:var(--accent);font-weight:600;}
  .brand .sub{color:var(--text-faint);font-size:11.5px;margin-top:4px;letter-spacing:.3px;}

  .navlist{list-style:none;margin:0;padding:10px;flex:1;overflow-y:auto;}
  .navlist li{margin-bottom:2px;}
  .navlink{
    display:flex;align-items:center;gap:10px;
    width:100%;text-align:left;background:none;border:none;
    color:var(--text-dim);
    padding:10px 12px;border-radius:8px;
    font-size:13.5px;cursor:pointer;
    font-family:var(--sans);
    transition:background .15s, color .15s;
  }
  .navlink .num{
    font-family:var(--serif);
    font-size:12px;color:var(--text-faint);
    width:16px;flex-shrink:0;
  }
  .navlink:hover{background:var(--bg-elev-2);color:var(--text);}
  .navlink.active{background:var(--accent-soft);color:var(--text);}
  .navlink.active .num{color:var(--accent);}

  .sidebar-foot{
    padding:14px 20px 18px;
    border-top:1px solid var(--border-soft);
  }
  .ring-wrap{display:flex;align-items:center;gap:10px;}
  .ring{width:38px;height:38px;flex-shrink:0;}
  .ring-label{font-size:11.5px;color:var(--text-faint);}
  .ring-label b{color:var(--text);font-size:13px;display:block;font-family:var(--serif);}

  .main{
    margin-left:250px;
    flex:1;
    min-width:0;
    display:flex;
    flex-direction:column;
  }

  .topbar{
    position:sticky;top:0;z-index:30;
    background:rgba(8,12,20,0.9);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--border-soft);
    padding:14px 28px;
    display:flex;align-items:center;gap:16px;
  }
  .menu-btn{
    display:none;background:none;border:1px solid var(--border);color:var(--text);
    width:34px;height:34px;border-radius:8px;cursor:pointer;font-size:16px;
  }
  .search-box{
    flex:1;max-width:440px;
    position:relative;
  }
  .search-box input{
    width:100%;
    background:var(--bg-elev-2);
    border:1px solid var(--border);
    color:var(--text);
    padding:9px 14px 9px 34px;
    border-radius:8px;
    font-size:13.5px;
    font-family:var(--sans);
    outline:none;
  }
  .search-box input:focus{border-color:var(--accent-dim);}
  .search-box input::placeholder{color:var(--text-faint);}
  .search-box .ico{
    position:absolute;left:11px;top:50%;transform:translateY(-50%);
    color:var(--text-faint);font-size:13px;pointer-events:none;
  }
  .topbar-spacer{flex:1;}
  .progress-pill{
    display:flex;align-items:center;gap:8px;
    background:var(--bg-elev-2);border:1px solid var(--border);
    padding:7px 12px;border-radius:999px;font-size:12px;color:var(--text-dim);
    white-space:nowrap;
  }
  .progress-pill .dot{width:7px;height:7px;border-radius:50%;background:var(--good);}

  .content{padding:28px 32px 80px;max-width:960px;width:100%;}

  .panel{display:none;}
  .panel.active{display:block;animation:fadein .2s ease;}
  @keyframes fadein{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}
  body.search-mode .panel{display:block !important;}
  body.search-mode .panel-empty-note{display:none;}

  .panel-head{margin-bottom:22px;}
  .panel-eyebrow{color:var(--accent);font-size:12px;font-family:var(--serif);font-style:italic;}
  .panel-title{
    font-family:var(--serif);
    font-size:28px;
    font-weight:400;
    margin:4px 0 8px;
    color:var(--text);
  }
  .panel-desc{color:var(--text-dim);font-size:14px;max-width:640px;}

  .group-title{
    font-size:12.5px;text-transform:none;color:var(--text-faint);
    margin:28px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--border-soft);
    letter-spacing:.2px;
  }
  .group-title:first-of-type{margin-top:0;}

  /* ===== Cards ===== */
  .card{
    border:1px solid var(--border-soft);
    border-left:3px solid var(--border);
    border-radius:6px;
    margin-bottom:10px;
    background:var(--bg-elev);
    overflow:hidden;
  }
  .card.done{border-left-color:var(--good);}
  .card-head{
    display:flex;align-items:flex-start;gap:10px;
    padding:13px 14px;
    cursor:pointer;
  }
  .card-check{
    margin-top:2px;
    width:16px;height:16px;flex-shrink:0;
    accent-color:var(--good);
    cursor:pointer;
  }
  .card-q{
    flex:1;font-size:14px;color:var(--text);font-weight:500;
  }
  .card-tag{
    font-size:10.5px;color:var(--text-faint);
    border:1px solid var(--border);
    padding:2px 7px;border-radius:20px;
    white-space:nowrap;margin-left:6px;
  }
  .chev{
    color:var(--text-faint);font-size:11px;flex-shrink:0;margin-top:3px;
    transition:transform .15s;
  }
  .card.open .chev{transform:rotate(90deg);}
  .card-body{display:none;padding:0 14px 16px 40px;}
  .card.open .card-body{display:block;}
  .card-body p{margin:0 0 10px;color:var(--text-dim);font-size:13.8px;white-space:pre-line;}
  .card-body .field-label{color:var(--gold);font-size:11.5px;font-family:var(--serif);font-style:italic;margin:12px 0 4px;}
  .card-body .field-label:first-child{margin-top:0;}
  .card-body .followup{
    border-left:2px solid var(--accent-dim);padding-left:10px;margin-top:8px;
    color:var(--text-faint);font-size:12.8px;font-style:italic;
  }
  .card-actions{display:flex;gap:8px;margin-top:6px;}
  .copy-btn{
    background:var(--bg-elev-2);border:1px solid var(--border);color:var(--text-dim);
    font-size:11.5px;padding:5px 10px;border-radius:6px;cursor:pointer;
    font-family:var(--sans);
  }
  .copy-btn:hover{color:var(--text);border-color:var(--accent-dim);}
  .copy-btn.copied{color:var(--good);border-color:var(--good);}

  /* project card */
  .proj-card{
    border:1px solid var(--border-soft);
    border-radius:8px;
    margin-bottom:22px;
    background:var(--bg-elev);
    overflow:hidden;
  }
  .proj-head{padding:16px 18px;border-bottom:1px solid var(--border-soft);}
  .proj-name{font-family:var(--serif);font-size:19px;color:var(--text);}
  .proj-30s{color:var(--text-dim);font-size:13.8px;margin-top:6px;}
  .proj-grid{display:grid;grid-template-columns:1fr 1fr;gap:0;border-bottom:1px solid var(--border-soft);}
  .proj-grid .cell{padding:14px 18px;border-right:1px solid var(--border-soft);}
  .proj-grid .cell:nth-child(2n){border-right:none;}
  @media(max-width:680px){.proj-grid{grid-template-columns:1fr;}.proj-grid .cell{border-right:none;border-bottom:1px solid var(--border-soft);}}
  .cell h4{margin:0 0 6px;font-size:11.5px;color:var(--gold);font-family:var(--serif);font-style:italic;font-weight:400;}
  .cell p, .cell ul{margin:0;color:var(--text-dim);font-size:13.3px;}
  .cell ul{padding-left:16px;}
  .proj-qa{padding:14px 18px 8px;}
  .proj-qa .qa-heading{font-size:11.5px;color:var(--text-faint);margin-bottom:8px;}

  .note-card{
    border:1px solid var(--border-soft);border-left:3px solid var(--accent-dim);
    border-radius:6px;padding:16px 18px;margin-bottom:14px;background:var(--bg-elev);
  }
  .note-card h3{margin:0 0 10px;font-family:var(--serif);font-size:17px;font-weight:400;color:var(--text);}
  .note-card ul{margin:0;padding-left:18px;color:var(--text-dim);font-size:13.6px;}
  .note-card li{margin-bottom:6px;}
  .note-card li b{color:var(--text);}

  .fact-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:22px;}
  @media(max-width:680px){.fact-grid{grid-template-columns:1fr 1fr;}}
  .fact{
    border:1px solid var(--border-soft);border-radius:8px;padding:14px 16px;background:var(--bg-elev);
  }
  .fact .num{font-family:var(--serif);font-size:22px;color:var(--accent);}
  .fact .lbl{font-size:11.5px;color:var(--text-faint);margin-top:2px;}

  .lastmin-block{
    border:1px solid var(--border-soft);border-radius:8px;padding:16px 18px;margin-bottom:14px;background:var(--bg-elev);
  }
  .lastmin-block h3{margin:0 0 8px;font-family:var(--serif);font-weight:400;font-size:15.5px;color:var(--accent);}
  .lastmin-block p, .lastmin-block li{color:var(--text-dim);font-size:13.4px;}
  .lastmin-block ul{margin:0;padding-left:18px;}

  .no-results{display:none;color:var(--text-faint);font-size:13px;padding:12px 0;font-style:italic;}

  .callout{
    background:var(--gold-soft);border:1px solid rgba(203,168,105,0.35);
    border-radius:8px;padding:12px 14px;font-size:12.8px;color:var(--text-dim);margin-bottom:18px;
  }
  .callout b{color:var(--gold);}

  ::-webkit-scrollbar{width:9px;height:9px;}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:6px;}
  ::-webkit-scrollbar-track{background:transparent;}

  /* Backdrop overlay */
  .sidebar-backdrop{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.65);
    backdrop-filter:blur(4px);
    -webkit-backdrop-filter:blur(4px);
    z-index:38;
    opacity:0;
    transition:opacity .25s ease;
  }
  .sidebar-backdrop.active{
    display:block;
    opacity:1;
  }

  .sidebar-close-btn{
    display:none;
    background:none;
    border:1px solid var(--border);
    color:var(--text-dim);
    width:28px;
    height:28px;
    border-radius:6px;
    font-size:12px;
    cursor:pointer;
    align-items:center;
    justify-content:center;
    transition:border-color .15s, color .15s;
  }
  .sidebar-close-btn:hover{
    border-color:var(--accent);
    color:var(--text);
  }

  @media(max-width:880px){
    .sidebar{
      width:min(280px, 84vw);
      transform:translateX(-100%);
      box-shadow:none;
    }
    .sidebar.open{
      transform:translateX(0);
      box-shadow:4px 0 24px rgba(0,0,0,0.5);
    }
    .sidebar-close-btn{display:inline-flex;}
    .main{margin-left:0;}
    .menu-btn{display:block;}
    .content{padding:20px 16px calc(60px + env(safe-area-inset-bottom, 15px));}
    .proj-grid{grid-template-columns:1fr;}
  }

  @media(max-width:600px){
    .topbar{
      padding:10px 12px;
      gap:8px;
    }
    .search-box{
      flex:1;
      min-width:0;
      max-width:none;
    }
    .search-box input{
      padding:8px 10px 8px 30px;
      font-size:13px;
    }
    .search-box input::placeholder{
      font-size:12px;
    }
    .search-box .ico{left:9px;}
    .topbar-spacer{display:none;}
    .progress-pill{
      padding:5px 9px;
      font-size:11px;
      gap:5px;
      flex-shrink:0;
    }
    .content{
      padding:16px 12px calc(60px + env(safe-area-inset-bottom, 15px));
    }
    .panel-head{margin-bottom:16px;}
    .panel-title{font-size:22px;}
    .panel-desc{font-size:13px;}
    .card{
      margin-bottom:8px;
    }
    .card-head{
      padding:11px 12px;
      gap:8px;
    }
    .card-q{
      font-size:13.5px;
      line-height:1.45;
    }
    .card-tag{
      font-size:10px;
      padding:1px 6px;
    }
    .card-body{
      padding:0 12px 14px 12px; /* remove 40px left indentation so answer text isn't cramped */
    }
    .card-body p{
      font-size:13.2px;
      line-height:1.52;
      word-break:break-word;
      overflow-wrap:anywhere;
    }
    .card-actions{
      margin-top:8px;
    }
    .copy-btn{
      padding:6px 12px;
      font-size:11.5px;
      min-height:32px;
    }
    .proj-card{
      margin-bottom:16px;
    }
    .proj-head{padding:12px 14px;}
    .proj-name{font-size:17px;}
    .proj-30s{font-size:13px;}
    .proj-grid .cell{padding:11px 13px;}
    .proj-qa{padding:12px 12px 6px;}
    .fact-grid{
      grid-template-columns:1fr;
      gap:8px;
      margin-bottom:16px;
    }
    .fact{padding:11px 14px;}
    .fact .num{font-size:20px;}
    .note-card{padding:13px 14px;}
    .note-card h3{font-size:15px;}
    .note-card ul{font-size:13px;padding-left:16px;}
    .lastmin-block{padding:13px 14px;}
    .lastmin-block h3{font-size:14.5px;}
    .lastmin-block p, .lastmin-block li{font-size:13px;}
    .callout{padding:10px 12px;font-size:12.5px;}
  }

  @media(max-width:380px){
    .progress-pill span#progressText{
      max-width:75px;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }
    .card-tag{display:none;}
  }

  @media (prefers-reduced-motion: reduce){
    *{animation:none !important;transition:none !important;}
  }
</style>
</head>
<body>
<div class="sidebar-backdrop" id="sidebarBackdrop"></div>
<div class="app">

  <nav class="sidebar" id="sidebar">
    <div class="brand">
      <div style="display:flex;align-items:center;justify-content:space-between;">
        <div class="mark">Black<b>Rock</b> Prep</div>
        <button class="sidebar-close-btn" id="sidebarCloseBtn" aria-label="Close menu">✕</button>
      </div>
      <div class="sub">Jilmil Saikia · SWE Intern</div>
    </div>
    <ul class="navlist" id="navlist"></ul>
    <div class="sidebar-foot">
      <div class="ring-wrap">
        <svg class="ring" viewBox="0 0 40 40">
          <circle cx="20" cy="20" r="16" fill="none" stroke="#1a2439" stroke-width="4"/>
          <circle id="ringProgress" cx="20" cy="20" r="16" fill="none" stroke="#5b93ff" stroke-width="4" stroke-linecap="round" stroke-dasharray="100.5" stroke-dashoffset="100.5" transform="rotate(-90 20 20)"/>
        </svg>
        <div class="ring-label"><b id="progressPct">0%</b>readiness</div>
      </div>
    </div>
  </nav>

  <div class="main">
    <div class="topbar">
      <button class="menu-btn" id="menuBtn">☰</button>
      <div class="search-box">
        <span class="ico">⌕</span>
        <input type="text" id="searchInput" placeholder="Search every answer, note and question…">
      </div>
      <div class="topbar-spacer"></div>
      <div class="progress-pill"><span class="dot"></span><span id="progressText">0 / 0 reviewed</span></div>
    </div>

    <div class="content" id="content"></div>
  </div>
</div>

<script>
/* ============================================================
   DATA
   ============================================================ */

const RESUME = {
  name: "Jilmil Saikia",
  college: "NIT Silchar, B.Tech CSE (CGPA 8.23), Aug 2023 – May 2027 (expected)"
};

const INTRO = "Good Morning, I am Jilmil Saikia, currently pursuing my B.Tech in Computer Science and Engineering from NIT Silchar.\n\nI have a keen interest in software engineering, particularly problem solving, frontend and backend development. I have been learning Data Structures and Algorithms, Object-Oriented Programming and CS fundamentals, and I primarily work with C++. I have also learnt SQL.\n\nRecently, during my internship, I worked on an AI-powered Text-to-SQL system using FastAPI, LangChain, RAG and ChromaDB, where I contributed in building the frontend and also a modular backend for retrieval, SQL generation, validation and execution.\n\nApart from that, I've built a full-stack application using React, Node.js, Express and MongoDB, and an OOP-based multiplayer chess game in C++.\n\nWhat excites me about this opportunity at BlackRock is the chance to apply these engineering fundamentals to real-world systems at scale, learn from experienced engineers, and contribute to technology that has real business and client impact.";

const WHY_BLACKROCK = "Three reasons:\n\n• BlackRock is a technology-driven company where software powers real financial systems through Aladdin.\n• The internship offers exposure to distributed systems, AI, APIs, cloud and production engineering.\n• I like BlackRock's focus on ownership, learning and solving problems with real business impact.";

const WHY_HIRE = "I bring strong CS fundamentals, hands-on software development experience, and a willingness to learn quickly. My projects show I can build modular, scalable applications, and I want to grow by working on production-grade systems.";

const FIVE_YEAR = "I want to see myself in a managerial post as a strong software engineer who can design, build and own scalable backend systems, while gradually taking responsibility for larger technical components and mentoring others.";

const STRENGTHS = "My three strengths are problem solving, built through DSA practice and applying it in real projects; being a fast learner across technologies, which let me pick up LangChain and RAG quickly for my internship; and ownership with modular thinking, which shows in how I structured the Text-to-SQL backend and the Sajeda Foundation app into separate, maintainable components.";

const WEAKNESS = "I sometimes spend extra time understanding concepts deeply before moving ahead, but I'm improving by building a working solution first and then iterating.";

/* ---------- HR & BEHAVIORAL ---------- */
const HR_ITEMS = [
  {id:"hr-1", q:"Tell me about yourself.", a:INTRO, tag:"Core", follow:"What part of the Text-to-SQL project are you most proud of?"},
  {id:"hr-2", q:"Why BlackRock?", a:WHY_BLACKROCK, tag:"Core", follow:"What do you know about Aladdin specifically?"},
  {id:"hr-3", q:"Why Software Engineering?", a:"I enjoy the combination of logical problem solving and building something tangible. DSA and OOP gave me a way of thinking about problems structurally, and I like that software engineering lets me take that thinking all the way from a design on paper to a working, scalable system — which is exactly what I did when I broke my Text-to-SQL project into retrieval, generation, validation and execution modules.", tag:"Core"},
  {id:"hr-4", q:"Why should we hire you?", a:WHY_HIRE, tag:"Core", follow:"Give me a concrete example of you learning something quickly."},
  {id:"hr-5", q:"What are your strengths?", a:STRENGTHS, tag:"Core"},
  {id:"hr-6", q:"What is your weakness?", a:WEAKNESS, tag:"Core", follow:"Can you give an example of when this slowed you down?"},
  {id:"hr-7", q:"Where do you see yourself in five years?", a:FIVE_YEAR, tag:"Core"},
  {id:"hr-8", q:"Tell me about a time you failed.", a:"Personalize this with a real moment — the framework below uses a plausible one from your own work, so adjust the specifics to what actually happened.\n\nWhile building the Text-to-SQL system, I initially underestimated how much time SQL validation would take and moved to execution too early, which produced queries that ran but returned wrong results. I had to step back, add a validation layer before execution, and rebuild that part of the pipeline. It taught me to design safety checks before optimizing for speed, and now I default to validating early instead of assuming the happy path.", tag:"Adapt to you"},
  {id:"hr-9", q:"Tell me about a conflict within a team and how you handled it.", a:"Personalize this with a real example from Sajeda Foundation or GDGC — the shape below is a safe template.\n\nWhile working on the Sajeda Foundation project with a team split across Client, Server and Admin modules, there was a disagreement over how an API contract between two modules should look. Instead of pushing my version, I suggested we quickly document the expected request and response shape together before writing more code, which resolved the disagreement in minutes and avoided rework later. I try to treat conflicts as a missing-information problem rather than a personal one.", tag:"Adapt to you"},
  {id:"hr-10", q:"Tell me about a time you showed leadership or ownership.", a:"As Media Head / Web-Dev core team member at GDGC NIT Silchar, I was responsible for parts of the club's web presence and coordination beyond just writing code — that meant taking ownership of a deliverable end-to-end rather than waiting to be told each step. The same instinct showed up in my internship, where I owned the retrieval-to-execution pipeline for the Text-to-SQL system rather than just one function inside it.", tag:"Core"},
  {id:"hr-11", q:"What is your biggest achievement so far?", a:"Academically, qualifying GATE 2026 in CSE stands out because it validated my CS fundamentals against a national-level benchmark. On the project side, I'm proud of building a working AI-powered Text-to-SQL system end-to-end during my internship — going from natural language input to a validated, executable SQL query — because it combined backend engineering with a newer area, applied AI, that I had to learn quickly.", tag:"Core"},
  {id:"hr-12", q:"What questions do you have for me?", a:"Good questions to ask, pick two or three:\n\n• What does a typical intern project look like on your team, and how is it scoped?\n• Which parts of Aladdin or the broader platform would an intern typically get exposure to?\n• How does the team decide when to bring in GenAI versus a traditional approach for a given problem?\n• What does success look like for an intern by the end of the program?\n• What has been the biggest engineering challenge your team has faced recently?", tag:"Core"}
];

/* ---------- RESUME DEEP DIVE (projects) ---------- */
const PROJECTS = [
{
  id:"proj-texttosql",
  name:"AI-Powered Text-to-SQL System (S. N. Bose Summer Internship)",

  architecture:"Four modular stages connected to an interactive frontend: (1) Retrieval — ChromaDB stores embeddings of schema/table metadata so relevant context is fetched via RAG for a given question; (2) Generation — LangChain orchestrates a call to the Groq LLM with the retrieved context and the user's question to produce a candidate SQL query; (3) Validation — the generated SQL is checked before it ever touches the database; (4) Execution — the validated query runs and results are returned to the frontend. FastAPI exposes this pipeline as REST endpoints.",

    {q:"Why did you use RAG instead of just prompting the LLM directly with the full schema?", a:"Passing the entire schema in every prompt doesn't scale — it's expensive, slow, and larger schemas won't even fit in context. RAG lets me retrieve only the tables and columns relevant to the specific question, which keeps prompts smaller, cheaper, and more accurate because the model isn't distracted by irrelevant tables."},
    {q:"How does ChromaDB fit into this specifically?", a:"ChromaDB stores vector embeddings of my schema metadata — table names, column names, and descriptions. When a question comes in, I embed the question the same way and do a similarity search against ChromaDB to pull back the closest matching schema chunks, which become the context for generation."},
    {q:"Why is SQL validation a separate stage instead of just running whatever the LLM generates?", a:"LLMs can hallucinate column names, generate syntactically valid but semantically wrong queries, or in the worst case produce destructive statements. Validating first — checking it references real tables/columns and is a safe, expected type of query — protects the database and catches errors before they become a bad user-facing result."},
    {q:"What would you check for during validation?", a:"At minimum: that referenced tables and columns actually exist in the schema, that the query is read-only where required, that it's syntactically valid SQL, and ideally a sanity check like an EXPLAIN or dry-run before full execution."},

    {q:"How would you handle a question that has no good matching schema context?", a:"I'd set a similarity-score threshold on the retrieval step — if nothing clears it, the system should say it can't confidently answer rather than forcing the LLM to guess and generate a plausible-looking but wrong query."},

{q:"Explain your chess engine's OOP design.", why:"Directly tests OOP depth via a concrete example.", a:"Base Piece class with each piece type overriding move validation via inheritance and polymorphism; Board and Player as separate collaborating classes.", follow:"How would you add check/checkmate detection?"},
{q:"What's the difference between overriding and overloading?", why:"Classic OOP fundamentals check.", a:"Overriding redefines a parent method in a child class with the same signature, resolved at runtime; overloading defines multiple methods with the same name but different parameters, resolved at compile time.", follow:"Give an example from your chess project."},
{q:"Composition vs inheritance — when would you choose one over the other?", why:"Tests design maturity beyond textbook definitions.", a:"Inheritance for a true 'is-a' relationship with shared behavior (a Rook is-a Piece); composition for a 'has-a' relationship where you just need to reuse behavior flexibly (a Board has Pieces) without a rigid hierarchy.", follow:"Where did you use composition in your chess project?"},
{q:"Explain ACID properties.", why:"Foundational DBMS question, near-guaranteed.", a:"Atomicity, Consistency, Isolation, Durability — guarantees that transactions are all-or-nothing, leave the DB valid, don't interfere with each other, and survive failures once committed.", follow:"Which property matters most for a payments system, and why?"},
{q:"WHERE vs HAVING?", why:"Common SQL fundamentals trap question.", a:"WHERE filters rows before aggregation; HAVING filters aggregated groups after GROUP BY.", follow:"Write a query using both in the same statement."},
{q:"Explain normalization and its trade-offs.", why:"Tests DB design fundamentals.", a:"Organizing tables (1NF/2NF/3NF) to reduce redundancy and anomalies, at the cost of needing more joins as you normalize further — sometimes denormalization is chosen deliberately for read performance.", follow:"When would you denormalize on purpose?"},
{q:"Process vs thread?", why:"Standard OS fundamentals question.", a:"A process has its own isolated memory space; threads share memory within a process, making them lighter but requiring careful handling of shared state.", follow:"What kind of bug is unique to multithreading?"},
{q:"What causes a deadlock, and how do you prevent it?", why:"Frequently asked OS concept with practical relevance.", a:"Four conditions must hold simultaneously — mutual exclusion, hold-and-wait, no preemption, circular wait; breaking any one prevents deadlock.", follow:"How would you detect a deadlock at runtime?"},
{q:"TCP vs UDP — when would you use each?", why:"Fundamental networking question, often tied to real system design.", a:"TCP for reliable, ordered delivery (web, file transfer); UDP for speed where occasional loss is acceptable (streaming, gaming, DNS).", follow:"Why does DNS use UDP?"},
{q:"What happens when you type a URL into a browser?", why:"Classic systems question testing networking breadth.", a:"DNS resolves the domain to an IP, a TCP connection is established (with a TLS handshake for HTTPS), an HTTP request is sent, the server responds, and the browser renders the response.", follow:"Where does HTTPS add overhead versus HTTP?"},
{q:"Explain REST and what 'stateless' means.", why:"Core to your Express/FastAPI backend experience.", a:"REST models resources with URLs manipulated via HTTP verbs; stateless means each request carries everything the server needs, so the server doesn't retain session state between calls — this is what enables horizontal scaling.", follow:"How does a stateless API still support 'logged-in' sessions?"},
{q:"What is a JWT and how does it work?", why:"Common for any backend/API-heavy resume.", a:"A signed token — header, payload, signature — used to authenticate requests; the server verifies the signature instead of storing session state, so it fits naturally with stateless REST APIs.", follow:"What happens if a JWT is stolen?"},
{q:"What is middleware in a backend framework?", why:"Tests practical Express/FastAPI knowledge.", a:"Functions that run between an incoming request and the final route handler — used for things like authentication checks, logging, and validation.", follow:"Give an example of middleware you might add to a login route."},
{q:"How would you design a REST API for a new feature?", why:"Applied system-design-lite question for interns.", a:"Model the feature as resources with clear nouns in the URL, choose HTTP verbs matching intent, keep responses consistent, and design for statelessness so it scales horizontally.", follow:"How would you version this API later?"},

/* ============================================================
   RENDER ENGINE
   ============================================================ */

const SECTIONS = [
  {id:"hr", label:"HR & Behavioral"},
  {id:"resume", label:"Resume Deep Dive"},
  {id:"technical", label:"Technical Revision"},
  {id:"ai", label:"AI / RAG"},
  {id:"blackrock", label:"BlackRock Prep"},
  {id:"top30", label:"Top 30 Questions"},
  {id:"lastmin", label:"Last-Minute Revision"}
];

let progressState = {};
try{ progressState = JSON.parse(localStorage.getItem('br_prep_progress') || '{}'); }catch(e){ progressState = {}; }

function saveProgress(){
  localStorage.setItem('br_prep_progress', JSON.stringify(progressState));
  updateProgressUI();
}

function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function makeQACard(item){
  const card = document.createElement('div');
  card.className = 'card';
  card.dataset.searchText = (item.q + ' ' + item.a + ' ' + (item.tag||'')).toLowerCase();
  if(progressState[item.id]) card.classList.add('done');

  const head = document.createElement('div');
  head.className = 'card-head';
  head.innerHTML = `
    <input type="checkbox" class="card-check" ${progressState[item.id] ? 'checked' : ''}>
    <div class="card-q">${escapeHtml(item.q)}</div>
    ${item.tag ? `<span class="card-tag">${escapeHtml(item.tag)}</span>` : ''}
    <span class="chev">▸</span>
  `;
  const body = document.createElement('div');
  body.className = 'card-body';
  body.innerHTML = `<p>${escapeHtml(item.a)}</p>` +
    (item.follow && item.follow !== '—' ? `<div class="followup">Possible follow-up: ${escapeHtml(item.follow)}</div>` : '') +
    `<div class="card-actions"><button class="copy-btn">Copy answer</button></div>`;

  head.addEventListener('click', (e)=>{
    if(e.target.classList.contains('card-check')) return;
    card.classList.toggle('open');
  });
  const check = head.querySelector('.card-check');
  check.addEventListener('click', (e)=>{
    e.stopPropagation();
    progressState[item.id] = check.checked;
    card.classList.toggle('done', check.checked);
    saveProgress();
  });
  const copyBtn = body.querySelector('.copy-btn');
  copyBtn.addEventListener('click', (e)=>{
    e.stopPropagation();
    navigator.clipboard.writeText(item.a).then(()=>{
      copyBtn.textContent = 'Copied ✓';
      copyBtn.classList.add('copied');
      setTimeout(()=>{ copyBtn.textContent='Copy answer'; copyBtn.classList.remove('copied'); }, 1400);
    });
  });

  card.appendChild(head);
  card.appendChild(body);
  return card;
}

function makeProjectCard(p){
  const card = document.createElement('div');
  card.className = 'proj-card';
  card.dataset.searchText = (p.name+' '+p.s30+' '+p.architecture+' '+p.tech.join(' ')+' '+p.challenges+' '+p.improvements+' '+p.qa.map(x=>x.q+' '+x.a).join(' ')).toLowerCase();

  const head = document.createElement('div');
  head.className = 'proj-head';
  head.innerHTML = `<div class="proj-name">${escapeHtml(p.name)}</div><div class="proj-30s">${escapeHtml(p.s30)}</div>`;
  card.appendChild(head);

  const grid = document.createElement('div');
  grid.className = 'proj-grid';
  grid.innerHTML = `
    <div class="cell"><h4>Architecture</h4><p>${escapeHtml(p.architecture)}</p></div>
    <div class="cell"><h4>Technologies</h4><p>${p.tech.map(escapeHtml).join(' · ')}</p></div>
    <div class="cell"><h4>Challenges</h4><p>${escapeHtml(p.challenges)}</p></div>
    <div class="cell"><h4>Improvements</h4><p>${escapeHtml(p.improvements)}</p></div>
  `;
  card.appendChild(grid);

  const qaWrap = document.createElement('div');
  qaWrap.className = 'proj-qa';
  qaWrap.innerHTML = `<div class="qa-heading">Probable interviewer questions</div>`;
  p.qa.forEach((qa, i)=>{
    const item = {id:p.id+'-q'+i, q:qa.q, a:qa.a, tag:null};
    qaWrap.appendChild(makeQACard(item));
  });
  card.appendChild(qaWrap);
  return card;
}

function makeNoteCard(n){
  const card = document.createElement('div');
  card.className = 'note-card';
  card.dataset.searchText = (n.topic+' '+n.points.join(' ')).toLowerCase().replace(/<[^>]+>/g,'');
  const checked = progressState[n.id];
  card.innerHTML = `
    <h3>${escapeHtml(n.topic)}</h3>
    <ul>${n.points.map(pt=>`<li>${pt}</li>`).join('')}</ul>
    <div class="card-actions" style="margin-top:10px;">
      <button class="copy-btn" data-copy>Copy notes</button>
      <label style="display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--text-faint);cursor:pointer;margin-left:auto;">
        <input type="checkbox" class="card-check" ${checked?'checked':''}> Reviewed
      </label>
    </div>
  `;
  const copyBtn = card.querySelector('[data-copy]');
  copyBtn.addEventListener('click', ()=>{
    const text = n.topic + '\n' + n.points.map(p=>'- '+p.replace(/<[^>]+>/g,'')).join('\n');
    navigator.clipboard.writeText(text).then(()=>{
      copyBtn.textContent = 'Copied ✓'; copyBtn.classList.add('copied');
      setTimeout(()=>{ copyBtn.textContent='Copy notes'; copyBtn.classList.remove('copied'); }, 1400);
    });
  });
  const check = card.querySelector('.card-check');
  check.addEventListener('change', ()=>{
    progressState[n.id] = check.checked;
    saveProgress();
  });
  return card;
}

/* ---------- Panel builders ---------- */

  container.innerHTML = `<div class="panel-head">
    <div class="panel-eyebrow">Section 1</div>
    <h1 class="panel-title">HR &amp; Behavioral</h1>
    <p class="panel-desc">Core answers to keep close to verbatim, plus behavioral questions to personalize with your own specifics.</p>
  </div>`;
  const list = document.createElement('div');
  HR_ITEMS.forEach(item=> list.appendChild(makeQACard(item)));
  container.appendChild(list);
}

function buildResume(container){
  container.innerHTML = `<div class="panel-head">
    <div class="panel-eyebrow">Section 2</div>
    <h1 class="panel-title">Resume Deep Dive</h1>
    <p class="panel-desc">Every line on your resume, unpacked into an explanation, architecture, tech stack, challenges, and the questions an interviewer is likely to ask.</p>

  <div class="callout"><b>Note:</b> a few answers below (GDGC, SIH, some behavioral) are marked to personalize — your resume states the fact but not every detail, so fill those in honestly rather than reciting the template.</div>`;

function buildBlackRock(container){
  container.innerHTML = `<div class="panel-head">
    <div class="panel-eyebrow">Section 5</div>
    <h1 class="panel-title">BlackRock Preparation</h1>
    <p class="panel-desc">What the firm does, what Aladdin is, and how the JD's technologies map to what you already know.</p>
  </div>`;
  const facts = document.createElement('div');
  facts.className = 'fact-grid';
  BR_FACTS.forEach(f=>{
    const d = document.createElement('div');
    d.className = 'fact';
    d.innerHTML = `<div class="num">${escapeHtml(f.num)}</div><div class="lbl">${escapeHtml(f.lbl)}</div>`;
    facts.appendChild(d);

  const list = document.createElement('div');

function buildTop30(container){
  container.innerHTML = `<div class="panel-head">
    <div class="panel-eyebrow">Section 6</div>
    <h1 class="panel-title">Top 30 Probable Questions</h1>
    <p class="panel-desc">The 30 questions most likely to come up, built from your resume and the JD, each with why it's asked and a likely follow-up.</p>
  </div>`;
  const list = document.createElement('div');
  TOP30.forEach((item, i)=>{
    const withWhy = {
      id:'top30-'+i,
      q: item.q,
      a: (item.why ? "Why they ask: " + item.why + "\n\n" : "") + "Answer: " + item.a,
      follow: item.follow,
      tag: 'Q'+(i+1)
    };
    list.appendChild(makeQACard(withWhy));
  });
  container.appendChild(list);

function buildLastMin(container){
  container.innerHTML = `<div class="panel-head">
    <div class="panel-eyebrow">Section 7</div>
    <h1 class="panel-title">15 Minutes Before the Interview</h1>
    <p class="panel-desc">Only the highest-priority facts. Skim top to bottom, then close the laptop.</p>
  </div>`;
  LASTMIN.forEach(item=>{
    const d = document.createElement('div');
    d.className = 'lastmin-block';
    d.dataset.searchText = (item.h+' '+item.b).toLowerCase();
    d.innerHTML = `<h3>${escapeHtml(item.h)}</h3><p>${escapeHtml(item.b)}</p>`;
    container.appendChild(d);
  });
}

const BUILDERS = {
  hr: buildHR,
  resume: buildResume,
  technical: buildTechnical,
  ai: buildAI,
  blackrock: buildBlackRock,
  top30: buildTop30,
  lastmin: buildLastMin
};

/* ============================================================
   INIT
   ============================================================ */

const contentEl = document.getElementById('content');
const navlistEl = document.getElementById('navlist');
let activeSection = 'hr';

function renderNav(){
  navlistEl.innerHTML = '';
  SECTIONS.forEach((s, i)=>{
    const li = document.createElement('li');
    const btn = document.createElement('button');
    btn.className = 'navlink' + (s.id===activeSection ? ' active' : '');
    btn.innerHTML = `<span class="num">${i+1}</span><span>${s.label}</span>`;
    btn.addEventListener('click', ()=> switchSection(s.id));
    li.appendChild(btn);
    navlistEl.appendChild(li);
  });
}

function switchSection(id){
  activeSection = id;
  document.getElementById('searchInput').value = '';
  document.body.classList.remove('search-mode');
  renderNav();
  renderPanels();
  closeSidebar();
  window.scrollTo({top:0, behavior:'instant'});
}

function renderPanels(){
  contentEl.innerHTML = '';
  SECTIONS.forEach(s=>{
    const panel = document.createElement('div');
    panel.className = 'panel' + (s.id===activeSection ? ' active' : '');
    panel.id = 'panel-'+s.id;
    contentEl.appendChild(panel);
    BUILDERS[s.id](panel);
  });
  updateProgressUI();
}

function countTotalCheckable(){
  return document.querySelectorAll('.card-check').length;
}
function updateProgressUI(){
  const boxes = document.querySelectorAll('#content .card-check, #content input[type=checkbox].card-check');
  const total = boxes.length;
  let done = 0;
  boxes.forEach(b=>{ if(b.checked) done++; });
  const pct = total ? Math.round((done/total)*100) : 0;
  document.getElementById('progressText').textContent = done + ' / ' + total + ' reviewed';
  document.getElementById('progressPct').textContent = pct + '%';
  const circumference = 100.5;
  const offset = circumference - (circumference * pct / 100);
  document.getElementById('ringProgress').setAttribute('stroke-dashoffset', offset);
}

/* ---------- search ---------- */
document.getElementById('searchInput').addEventListener('input', (e)=>{
  const q = e.target.value.trim().toLowerCase();
  if(!q){
    document.body.classList.remove('search-mode');
    renderPanels();
    document.querySelectorAll('.panel').forEach(p=> p.classList.toggle('active', p.id === 'panel-'+activeSection));
    return;
  }
  document.body.classList.add('search-mode');
  document.querySelectorAll('.panel').forEach(p=> p.classList.add('active'));
  document.querySelectorAll('#content .card, #content .proj-card, #content .note-card, #content .lastmin-block').forEach(el=>{
    const text = el.dataset.searchText || el.textContent.toLowerCase();
    const match = text.includes(q);
    el.style.display = match ? '' : 'none';
    if(match && el.classList.contains('card')) el.classList.add('open');
  });
  // hide project cards with zero visible nested QA and no match on own fields
  document.querySelectorAll('#content .proj-card').forEach(pc=>{
    const ownMatch = (pc.dataset.searchText||'').includes(q);
    const visibleChildren = pc.querySelectorAll('.card:not([style*="display: none"])').length;
    if(!ownMatch && visibleChildren === 0){ pc.style.display = 'none'; }
    else { pc.style.display = ''; }
  });
});

/* ---------- sidebar toggle (mobile) ---------- */
const sidebarEl = document.getElementById('sidebar');
const backdropEl = document.getElementById('sidebarBackdrop');
const menuBtn = document.getElementById('menuBtn');
const closeBtn = document.getElementById('sidebarCloseBtn');

function openSidebar(){
  sidebarEl.classList.add('open');
  backdropEl.classList.add('active');
  document.body.style.overflow = 'hidden';
}

function closeSidebar(){
  sidebarEl.classList.remove('open');
  backdropEl.classList.remove('active');
  document.body.style.overflow = '';
}

menuBtn.addEventListener('click', ()=>{
  if(sidebarEl.classList.contains('open')) closeSidebar();
  else openSidebar();
});
if(closeBtn) closeBtn.addEventListener('click', closeSidebar);
if(backdropEl) backdropEl.addEventListener('click', closeSidebar);

/* ---------- initial render ---------- */
renderNav();
renderPanels();
</script>

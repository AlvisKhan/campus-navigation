<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Private Vault · Archives</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: rgba(22, 30, 49, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.25);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --tag-bg: rgba(56, 189, 248, 0.12);
      --tag-border: rgba(56, 189, 248, 0.25);
      --tag-text: #7dd3fc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 16px 80px;
      position: relative;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Ambient background glow */
    .bg-glow-1 {
      position: fixed;
      top: -120px;
      left: 50%;
      transform: translateX(-50%);
      width: min(600px, 100vw);
      height: 400px;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.14) 0%, rgba(11, 15, 25, 0) 70%);
      z-index: -1;
      pointer-events: none;
    }

    .container {
      width: 100%;
      max-width: 860px;
    }

    /* Header */
    .header {
      margin-bottom: 24px;
      text-align: center;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      border-radius: 9999px;
      background: var(--tag-bg);
      border: 1px solid var(--tag-border);
      color: var(--tag-text);
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #38bdf8;
      box-shadow: 0 0 8px #38bdf8;
      animation: pulse 2s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    h1 {
      font-size: clamp(1.85rem, 5vw, 2.5rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      background: linear-gradient(135deg, #ffffff 40%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 4px;
      line-height: 1.2;
    }

    .subheading {
      color: var(--text-muted);
      font-size: 0.95rem;
      letter-spacing: 0.04em;
    }

    /* Search & Stats Bar */
    .controls-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 14px;
      align-items: stretch;
      width: 100%;
    }

    .search-input-wrapper {
      flex: 1;
      position: relative;
      min-width: 0;
    }

    .search-input {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px 14px 12px 38px;
      color: var(--text);
      font-size: 0.9rem;
      outline: none;
      transition: all 0.2s ease;
      backdrop-filter: blur(12px);
      -webkit-appearance: none;
    }

    .search-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 0.95rem;
      pointer-events: none;
    }

    .files-count {
      font-size: 0.78rem;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
      padding: 0 12px;
      background: rgba(255, 255, 255, 0.04);
      border-radius: 12px;
      border: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* Filter Chips Ribbon */
    .filter-chips-container {
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      margin-bottom: 16px;
      padding-bottom: 4px;
    }

    .filter-chips-container::-webkit-scrollbar {
      display: none;
    }

    .filter-chips {
      display: flex;
      gap: 8px;
      width: max-content;
    }

    .filter-chip {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
    }

    .filter-chip:hover, .filter-chip.active {
      background: rgba(56, 189, 248, 0.15);
      border-color: var(--accent);
      color: #ffffff;
    }

    /* Grid of files */
    .files-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
    }

    .file-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      backdrop-filter: blur(12px);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      overflow: hidden;
    }

    .file-card:hover {
      transform: translateY(-2px);
      border-color: rgba(56, 189, 248, 0.4);
      background: rgba(30, 41, 67, 0.85);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4), 0 0 16px var(--accent-glow);
    }

    /* Desktop Layout */
    .file-card-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 16px 18px;
    }

    .file-card-left {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      min-width: 0;
      flex: 1;
      text-decoration: none;
      color: inherit;
    }

    .file-icon-box {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      flex-shrink: 0;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--card-border);
      margin-top: 2px;
    }

    .file-info {
      min-width: 0;
      flex: 1;
    }

    .file-title {
      font-size: 1rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 6px;
      line-height: 1.35;
      word-break: break-word;
    }

    .file-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.75rem;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
      flex-wrap: wrap;
      line-height: 1.4;
    }

    .ext-badge {
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.7rem;
      letter-spacing: 0.04em;
      flex-shrink: 0;
    }

    /* Format colors */
    .ext-pdf { background: rgba(239, 68, 68, 0.15); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.3); }
    .ext-word { background: rgba(59, 130, 246, 0.15); color: #93c5fd; border: 1px solid rgba(59, 130, 246, 0.3); }
    .ext-spreadsheet { background: rgba(16, 185, 129, 0.15); color: #6ee7b7; border: 1px solid rgba(16, 185, 129, 0.3); }
    .ext-presentation { background: rgba(245, 158, 11, 0.15); color: #fcd34d; border: 1px solid rgba(245, 158, 11, 0.3); }
    .ext-web { background: rgba(56, 189, 248, 0.15); color: #7dd3fc; border: 1px solid rgba(56, 189, 248, 0.3); }
    .ext-document { background: rgba(168, 85, 247, 0.15); color: #d8b4fe; border: 1px solid rgba(168, 85, 247, 0.3); }
    .ext-image { background: rgba(236, 72, 153, 0.15); color: #f472b6; border: 1px solid rgba(236, 72, 153, 0.3); }
    .ext-archive { background: rgba(234, 179, 8, 0.15); color: #fde047; border: 1px solid rgba(234, 179, 8, 0.3); }
    .ext-other { background: rgba(148, 163, 184, 0.15); color: #cbd5e1; border: 1px solid rgba(148, 163, 184, 0.3); }

    .folder-badge {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #94a3b8;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 4px;
      font-size: 0.7rem;
      letter-spacing: 0.02em;
      display: inline-flex;
      align-items: center;
      gap: 3px;
      flex-shrink: 0;
    }

    .file-path {
      color: var(--text-muted);
      word-break: break-all;
    }

    .file-card-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .btn-action {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--card-border);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 9px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.15s ease;
      text-decoration: none;
      white-space: nowrap;
    }

    .btn-action:hover {
      background: var(--accent);
      color: #0b0f19;
      border-color: var(--accent);
    }

    .btn-action-primary {
      background: rgba(56, 189, 248, 0.12);
      border-color: rgba(56, 189, 248, 0.3);
      color: #7dd3fc;
    }

    /* Mobile Responsive Optimizations */
    @media (max-width: 640px) {
      body {
        padding: 24px 12px 60px;
      }

      .file-card-inner {
        flex-direction: column;
        align-items: stretch;
        gap: 12px;
        padding: 14px;
      }

      .file-card-left {
        gap: 12px;
      }

      .file-icon-box {
        width: 38px;
        height: 38px;
        font-size: 1.15rem;
      }

      .file-title {
        font-size: 0.95rem;
        margin-bottom: 5px;
      }

      .file-meta {
        font-size: 0.72rem;
        gap: 6px;
      }

      .file-card-right {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        width: 100%;
        padding-top: 8px;
        border-top: 1px solid rgba(255, 255, 255, 0.04);
      }

      .btn-action {
        justify-content: center;
        padding: 9px 10px;
        font-size: 0.8rem;
      }
    }

    .empty-state {
      text-align: center;
      padding: 50px 20px;
      background: var(--card-bg);
      border: 1px dashed var(--card-border);
      border-radius: 16px;
      color: var(--text-muted);
    }

    .empty-icon {
      font-size: 2.2rem;
      margin-bottom: 10px;
    }

    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #0284c7;
      color: #ffffff;
      padding: 10px 18px;
      border-radius: 9999px;
      font-size: 0.82rem;
      font-weight: 600;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 100;
      white-space: nowrap;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>
  <div class="bg-glow-1"></div>

  <div class="container">
    <header class="header">
      <div class="badge">
        <span class="badge-dot"></span>
        <span>PRIVATE VAULT</span>
      </div>
      <h1>Private Vault</h1>
      <p class="subheading">archives</p>
    </header>

    <div class="controls-bar">
      <div class="search-input-wrapper">
        <span class="search-icon">🔍</span>
        <input 
          type="text" 
          id="search-input" 
          class="search-input" 
          placeholder="Search by title, name, or type..." 
          autocomplete="off"
        />
      </div>
      <div id="files-count" class="files-count">0 FILES</div>
    </div>

    <!-- Category Filter Chips Ribbon -->
    <div class="filter-chips-container">
      <div id="filter-chips" class="filter-chips">
        <button class="filter-chip active" data-filter="all">All</button>
        <button class="filter-chip" data-filter="web">📄 HTML</button>
        <button class="filter-chip" data-filter="pdf">📕 PDF</button>
        <button class="filter-chip" data-filter="word">📘 Word</button>
        <button class="filter-chip" data-filter="presentation">📙 PPT</button>
        <button class="filter-chip" data-filter="spreadsheet">📊 Excel</button>
        <button class="filter-chip" data-filter="document">📝 Text</button>
      </div>
    </div>

    <div id="files-grid" class="files-grid">
      <!-- Dynamically populated from files.json -->
    </div>

    <div id="empty-state" class="empty-state" style="display: none;">
      <div class="empty-icon">📂</div>
      <h3 style="margin-bottom: 6px; color: #fff; font-size: 1.1rem;">No matching documents</h3>
      <p style="font-size: 0.88rem;">Try a different search query or filter.</p>
    </div>
  </div>

  <div id="toast" class="toast">Link copied to clipboard!</div>

  <script>
    let allFiles = [];
    let currentCategory = 'all';

    async function loadFiles() {
      try {
        const res = await fetch('/alvis/files.json?t=' + Date.now());
        if (!res.ok) throw new Error('files.json not found');
        allFiles = await res.json();
      } catch (err) {
        console.warn('Using fallback file list:', err);
        allFiles = [
          {
            filename: 'sql-interview-prep.html',
            title: 'sql://interview_prep',
            extension: 'HTML',
            category: 'web',
            icon: '📄',
            sizeFormatted: '71 KB'
          }
        ];
      }
      renderFiles();
    }

    function getBadgeClass(category) {
      switch(category) {
        case 'pdf': return 'ext-pdf';
        case 'word': return 'ext-word';
        case 'spreadsheet': return 'ext-spreadsheet';
        case 'presentation': return 'ext-presentation';
        case 'web': return 'ext-web';
        case 'document': return 'ext-document';
        case 'image': return 'ext-image';
        case 'archive': return 'ext-archive';
        default: return 'ext-other';
      }
    }

    function renderFiles() {
      const grid = document.getElementById('files-grid');
      const countEl = document.getElementById('files-count');
      const emptyState = document.getElementById('empty-state');
      const query = document.getElementById('search-input').value.toLowerCase().trim();

      const filtered = allFiles.filter(f => {
        const matchesCategory = currentCategory === 'all' || f.category === currentCategory;
        const matchesQuery = !query || 
          (f.title && f.title.toLowerCase().includes(query)) ||
          (f.filename && f.filename.toLowerCase().includes(query)) ||
          (f.folder && f.folder.toLowerCase().includes(query)) ||
          (f.extension && f.extension.toLowerCase().includes(query));
        return matchesCategory && matchesQuery;
      });

      countEl.textContent = `${filtered.length} FILE${filtered.length === 1 ? '' : 'S'}`;

      if (filtered.length === 0) {
        grid.innerHTML = '';
        emptyState.style.display = 'block';
        return;
      }

      emptyState.style.display = 'none';
      grid.innerHTML = filtered.map(file => {
        const fileUrl = `/alvis/${file.filename}`;
        const fullUrl = `${window.location.origin}/alvis/${file.filename}`;
        const extClass = getBadgeClass(file.category || 'other');
        const icon = file.icon || '📄';
        const ext = file.extension || 'FILE';

        return `
          <div class="file-card">
            <div class="file-card-inner">
              <a class="file-card-left" href="${fileUrl}" target="_blank" rel="noopener noreferrer">
                <div class="file-icon-box">${icon}</div>
                <div class="file-info">
                  <div class="file-title">${escapeHtml(file.title)}</div>
                  <div class="file-meta">
                    <span class="ext-badge ${extClass}">${ext}</span>
                    ${file.folder ? `<span class="folder-badge">📁 ${escapeHtml(file.folder)}</span>` : ''}
                    <span class="file-path">${escapeHtml(file.filename)}</span>
                    ${file.sizeFormatted ? `<span>•</span><span>${file.sizeFormatted}</span>` : ''}
                  </div>
                </div>
              </a>
              <div class="file-card-right">
                <button class="btn-action" onclick="copyLink('${fullUrl}', event)" title="Copy direct URL">
                  <span>🔗</span> Copy
                </button>
                <a class="btn-action btn-action-primary" href="${fileUrl}" target="_blank" rel="noopener noreferrer" title="Open in new tab">
                  <span>Open</span> ↗
                </a>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function escapeHtml(text) {
      if (!text) return '';
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function copyLink(url, event) {
      if (event) event.stopPropagation();
      navigator.clipboard.writeText(url).then(() => {
        showToast('Link copied to clipboard!');
      }).catch(() => {
        showToast('Copied: ' + url);
      });
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 2500);
    }

    document.getElementById('search-input').addEventListener('input', () => {
      renderFiles();
    });

    // Chip filter clicks
    document.querySelectorAll('.filter-chip').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('.filter-chip').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentCategory = btn.getAttribute('data-filter');
        renderFiles();
      });
    });

    loadFiles();
  </script>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Circle/Container Gradient -->
    <linearGradient id="bgTileGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Map Fold 1 (Left Panel) -->
    <linearGradient id="foldLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Map Fold 2 (Center Panel - Slightly in shadow/perspective) -->
    <linearGradient id="foldCenter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>

    <!-- Map Fold 3 (Right Panel) -->
    <linearGradient id="foldRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Pin Gradient (Vibrant Neon Coral / Crimson Red) -->
    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3b5c"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Rounded Container Badge -->
  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#bgTileGrad)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Folded Map Layer -->
  <g transform="translate(0, 4)">
    <!-- Left Map Fold -->
    <polygon points="12,20 25,14 25,44 12,50" fill="url(#foldLeft)" opacity="0.95"/>

    <!-- Center Map Fold -->
    <polygon points="25,14 39,20 39,50 25,44" fill="url(#foldCenter)" opacity="0.85"/>

    <!-- Right Map Fold -->
    <polygon points="39,20 52,14 52,44 39,50" fill="url(#foldRight)" opacity="0.95"/>

    <!-- Map Road / Route Path Lines on the map -->
    <polyline points="15,38 25,32 39,36 49,26" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
    
    <!-- Dotted Secondary Path -->
    <polyline points="18,28 25,22 39,26 46,38" fill="none" stroke="#fbbf24" stroke-width="1.2" stroke-dasharray="2 2" opacity="0.85"/>
  </g>

  <!-- Glowing Location Map Pin on Center/Right Fold -->
  <g transform="translate(32, 16)" filter="url(#softGlow)">
    <!-- Pin Shape -->
    <path 
      d="M0,-12 C-6,-12 -10,-7.5 -10,-2 C-10,4.5 0,14 0,14 C0,14 10,4.5 10,-2 C10,-7.5 6,-12 0,-12 Z" 
      fill="url(#pinGrad)" 
      stroke="#ffffff" 
      stroke-width="1.2"
    />
    <!-- Inner Pin Dot -->
    <circle cx="0" cy="-3" r="3.2" fill="#ffffff"/>
  </g>

  <!-- Pulse beacon ring around pin target -->
  <ellipse cx="32" cy="34" rx="8" ry="3.5" fill="none" stroke="#00f5a0" stroke-width="1" opacity="0.75"/>
</svg>